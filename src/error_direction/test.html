<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウイルス感染演出 - デモ</title>
    <link rel="stylesheet" href="./virus.css">

    <style>
        /* ← セレクタ修正 */
        #error_1 {
            width: 300px;
            height: 260px;
            background-color: red;
        }
    </style>
</head>
<body>

    <h2>ウイルス演出テストページ</h2>

    <!-- テスト用のボタンを追加 -->
    <button id="start-virus">演出を開始</button>
    <button id="clear-virus">全消去</button>

    <div id="error_1">
        <div id="error_2">
            <div id="error_3"></div>
        </div>
        <div id="error_4"></div>
    </div>

    <script type="module">
        import { VirusPopupSimulator } from './virus.js';

        const simulator = new VirusPopupSimulator({
            count: 100,
            interval: 10,
            maxOnScreen: 100,
            enableGlitch: true,
            messages: [
                'ウイルス検出！',
                'システムスキャン実行中',
                'ファイルが破損しています',
                '緊急アップデート推奨',
                'データを復旧してください',
                'クリックして続行',
                'セキュリティエラー'
            ]
        });

        document.getElementById('start-virus').addEventListener('click', () => {
            simulator.clear();
            simulator.start();
        });

        document.getElementById('clear-virus').addEventListener('click', () => {
            simulator.clear();
        });
    </script>
</body>
</html>
