<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>古いメモ.doc</title>
    <link rel="stylesheet" href="../css/style_con.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding-top: 20px;
            background: #111;
            overflow: hidden;
            box-sizing: border-box;
        }
        .document {
            width: 100%;
            height: 100%;
            padding: 8px;
            box-sizing: border-box;
            overflow: auto;
            font-family: 'Yu Gothic', 'メイリオ', sans-serif;
            color: #e0e0e0;
            background-color: #111;
        }
        h1 {
            color: #569cd6;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-top: 28px;
            font-size: 18px;
        }
        .content {
            line-height: 1.8;
            font-size: 14px;
            padding: 8px;
        }
        .date {
            color: #888;
            font-size: 12px;
            margin-bottom: 15px;
            padding-left: 8px;
        }

        /* カスタムスクロールバー */
        .document::-webkit-scrollbar {
            width: 10px;
        }
        .document::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .document::-webkit-scrollbar-thumb {
            background: rgba(100, 100, 100, 0.6);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .document::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.8);
        }
        /* Firefox用 */
        .document {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 100, 100, 0.6) rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="document">
        <h1>📝 古いメモ</h1>
        <div class="date">作成日: 2024年3月15日</div>
        <div class="content">
            <p>これは以前作成したメモです。</p>
            
            <p><strong>やることリスト:</strong></p>
            <ul>
                <li>システムの更新確認</li>
                <li>不要ファイルの整理</li>
                <li>セキュリティチェック</li>
            </ul>
            
            <p>このメモはもう必要ないかもしれませんが、念のため保存しておきます。</p>
            
            <p style="color: #888; font-style: italic;">--- 文書の終わり ---</p>
        </div>
    </div>
</body>
</html>
