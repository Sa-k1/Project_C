<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>重要なデータ.txt</title>
    <link rel="stylesheet" href="../css/style_con.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding-top: 20px;
            background: #111;
            overflow: hidden;
            box-sizing: border-box;
        }
        .notepad {
            width: 100%;
            height: 100%;
            padding: 8px;
            box-sizing: border-box;
            overflow: auto;
            font-family: 'Consolas', 'MS Gothic', monospace;
            color: #d4d4d4;
            background-color: #111;
        }
        .content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
            padding: 8px;
            margin-top: 20px;
        }

        /* カスタムスクロールバー */
        .notepad::-webkit-scrollbar {
            width: 10px;
        }
        .notepad::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .notepad::-webkit-scrollbar-thumb {
            background: rgba(100, 100, 100, 0.6);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .notepad::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.8);
        }
        /* Firefox用 */
        .notepad {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 100, 100, 0.6) rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="notepad">
        <div class="content">
=== 重要なデータ ===

作成日: 2025年11月27日
最終更新: 2025年11月27日

------------------------------
このファイルには重要な情報が
含まれています。

取り扱いには十分注意してください。
------------------------------

メモ:
- プロジェクトの進捗状況を確認する
- 次回のミーティングは来週月曜日
- バックアップを忘れずに取る

[EOF]
        </div>
    </div>
</body>
</html>
