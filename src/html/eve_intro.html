<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE - System Connection</title>
    <link rel="stylesheet" href="../css/eve_intro.css">
</head>
<body>
    <!-- メインキャンバス -->
    <canvas id="scene"></canvas>
    
    <!-- UI オーバーレイ -->
    <div id="ui-overlay">
        <!-- EVEメッセージ表示エリア -->
        <div id="eve-message-container">
            <div id="eve-message" class="eve-text"></div>
        </div>
        
        <!-- データストリームUI -->
        <div id="data-streams">
            <div class="data-stream" style="top: 20%; left: 10%;"></div>
            <div class="data-stream" style="top: 60%; left: 80%;"></div>
            <div class="data-stream" style="top: 40%; left: 90%;"></div>
        </div>
        
        <!-- グリッチオーバーレイ -->
        <div id="glitch-overlay"></div>
        
        <!-- スキャンライン -->
        <div id="scanline"></div>
        
        <!-- ビネット効果 -->
        <div id="vignette"></div>
    </div>


    
    <!-- Three.js ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- ポストプロセッシング用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/GlitchPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/DigitalGlitch.js"></script>
    
    <!-- メインスクリプト -->
    <script src="../js/eve_intro.js"></script>
</body>
</html>
