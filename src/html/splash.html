<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash</title>
    <link rel="stylesheet" href="../css/anime.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: 'Roboto', Arial, sans-serif; /* フォントをRobotoに変更 */
      font-size: 24px;
      overflow: hidden;
    }
    .fade-in {
    z-index: 100;  
    animation: fadeIn 2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .expanding-box {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background-color: #61dafb;
      transform: translate(-50%, -50%) scale(1);
      animation: expandToFullscreen 2s forwards;
    }
    @keyframes expandToFullscreen {
      to {
        width: 100vw;
        height: 100vh;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .rotating-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px; /* サイズを大きく */
      height: 150px; /* サイズを大きく */
      border: 8px solid transparent;
      border-top: 8px solid #61dafb;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: spin 2s linear infinite;
    }


    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }


    body {
      animation: backgroundShift 10s infinite alternate;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    .rotating-circle {
      animation: spin 2s linear infinite, pulse 3s infinite;
    }

    .glow-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(97,218,251,0.7) 0%, rgba(97,218,251,0) 70%);
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite;
      z-index: 50;
    }

    body {
      font-family: 'Atma', Arial, sans-serif; /* フォントをAtmaに変更 */
    }

    h1.fade-in {
      font-family: 'Atma', Arial, sans-serif; /* E.V.Eのフォントを変更 */
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    @keyframes fadeToWhite {
      0% { opacity: 0; }
      50% { opacity: 0; } /* 最初の1.5秒は透明 */
      100% { opacity: 1; background: white; } /* 次の1.5秒でフェードアウト */
    }

    .fade-out-white {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      animation: fadeToWhite 3s forwards;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <h1 class="fade-in">E.V.E</h1>
  <!-- <div class="expanding-box"></div> -->
  <div class="rotating-circle"></div>
  <div class="glow-ring"></div>
  <div class="fade-out-white"></div>
  <script src="../js/anime.js" defer></script>
</body>

</html>
