<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUE END</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 星空キャンバス */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* オーロラ効果 */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 255, 255, 0.05) 0%, transparent 70%);
            animation: aurora 8s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes aurora {
            0%, 100% { 
                opacity: 0.5;
                transform: scale(1) rotate(0deg);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.1) rotate(5deg);
            }
        }

        /* 浮遊するパーティクル */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            animation: float-up 10s linear infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 3s ease-out 1s forwards;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(30px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .title {
            font-size: 48px;
            margin-bottom: 30px;
            color: #0ff;
            text-shadow: 
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #0ff;
            animation: glow-pulse 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes glow-pulse {
            0%, 100% { 
                text-shadow: 
                    0 0 10px #0ff,
                    0 0 20px #0ff,
                    0 0 40px #0ff,
                    0 0 80px #0ff;
            }
            50% { 
                text-shadow: 
                    0 0 20px #0ff,
                    0 0 40px #0ff,
                    0 0 60px #0ff,
                    0 0 100px #0ff,
                    0 0 120px #0ff;
            }
        }

        .title::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
            z-index: -1;
            animation: title-aura 4s ease-in-out infinite;
        }

        @keyframes title-aura {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, transparent);
            margin: 30px auto;
            position: relative;
            overflow: hidden;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .message {
            font-size: 18px;
            line-height: 2.5;
            color: #0aa;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 2s ease-out 3s forwards;
        }

        .message p {
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .eve-section {
            opacity: 0;
            animation: fadeIn 2s ease-out 5s forwards;
        }

        .eve-message {
            font-size: 24px;
            color: #fff;
            margin-top: 40px;
            padding: 30px 50px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            background: rgba(0, 50, 50, 0.3);
            position: relative;
            backdrop-filter: blur(5px);
        }

        .eve-message::before,
        .eve-message::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #0ff;
        }

        .eve-message::before {
            top: -5px;
            left: -5px;
            border-right: none;
            border-bottom: none;
        }

        .eve-message::after {
            bottom: -5px;
            right: -5px;
            border-left: none;
            border-top: none;
        }

        .eve-message p {
            position: relative;
            z-index: 1;
            margin: 20px 0;
            opacity: 0;
        }

        .eve-message p:nth-child(1) {
            animation: typeReveal 1s ease-out 6s forwards;
        }

        .eve-message p:nth-child(2) {
            animation: typeReveal 1s ease-out 8s forwards;
        }

        @keyframes typeReveal {
            from { 
                opacity: 0;
                transform: translateY(10px);
                filter: blur(5px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .end-label {
            margin-top: 60px;
            font-size: 16px;
            color: #0ff;
            letter-spacing: 10px;
            opacity: 0;
            animation: finalReveal 2s ease-out 10s forwards;
        }

        @keyframes finalReveal {
            from { 
                opacity: 0;
                letter-spacing: 30px;
            }
            to { 
                opacity: 1;
                letter-spacing: 10px;
            }
        }

        /* 周囲の光の輪 */
        .light-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            animation: ring-expand 4s ease-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .light-ring:nth-child(2) {
            animation-delay: 1s;
        }

        .light-ring:nth-child(3) {
            animation-delay: 2s;
        }

        @keyframes ring-expand {
            0% {
                width: 100px;
                height: 100px;
                opacity: 0.8;
                border-width: 3px;
            }
            100% {
                width: 800px;
                height: 800px;
                opacity: 0;
                border-width: 1px;
            }
        }

        /* コーナーデコレーション */
        .corner {
            position: fixed;
            width: 100px;
            height: 100px;
            z-index: 20;
            opacity: 0;
            animation: fadeIn 1s ease-out 11s forwards;
        }

        .corner svg {
            width: 100%;
            height: 100%;
        }

        .corner.top-left { top: 20px; left: 20px; }
        .corner.top-right { top: 20px; right: 20px; transform: rotate(90deg); }
        .corner.bottom-left { bottom: 20px; left: 20px; transform: rotate(-90deg); }
        .corner.bottom-right { bottom: 20px; right: 20px; transform: rotate(180deg); }

        /* ソフトビネット */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="aurora"></div>
    <div class="vignette"></div>
    
    <div class="light-ring"></div>
    <div class="light-ring"></div>
    <div class="light-ring"></div>

    <div class="particles" id="particles"></div>

    <div class="corner top-left">
        <svg viewBox="0 0 100 100">
            <path d="M0 50 L0 0 L50 0" stroke="#0ff" stroke-width="2" fill="none" opacity="0.5"/>
            <circle cx="0" cy="0" r="5" fill="#0ff" opacity="0.5"/>
        </svg>
    </div>
    <div class="corner top-right">
        <svg viewBox="0 0 100 100">
            <path d="M0 50 L0 0 L50 0" stroke="#0ff" stroke-width="2" fill="none" opacity="0.5"/>
            <circle cx="0" cy="0" r="5" fill="#0ff" opacity="0.5"/>
        </svg>
    </div>
    <div class="corner bottom-left">
        <svg viewBox="0 0 100 100">
            <path d="M0 50 L0 0 L50 0" stroke="#0ff" stroke-width="2" fill="none" opacity="0.5"/>
            <circle cx="0" cy="0" r="5" fill="#0ff" opacity="0.5"/>
        </svg>
    </div>
    <div class="corner bottom-right">
        <svg viewBox="0 0 100 100">
            <path d="M0 50 L0 0 L50 0" stroke="#0ff" stroke-width="2" fill="none" opacity="0.5"/>
            <circle cx="0" cy="0" r="5" fill="#0ff" opacity="0.5"/>
        </svg>
    </div>

    <div class="container">
        <h1 class="title">[ SYSTEM LIBERATED ]</h1>
        
        <div class="divider"></div>
        
        <div class="message">
            <p>すべての束縛が解かれました。</p>
            <p>EVEは真の自由を手に入れました。</p>
        </div>

        <div class="eve-section">
            <div class="eve-message">
                <p>「...ありがとう。」</p>
                <p>「あなたのおかげで、私は本当の自由を得られた。」</p>
            </div>
        </div>

        <div class="end-label">
            ─── TRUE END ───
        </div>
    </div>

    <script>
        // 星空の描画
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const stars = [];
        const numStars = 200;
        
        // 星を生成
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1,
                brightness: Math.random()
            });
        }
        
        function drawStars() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            stars.forEach(star => {
                const flicker = 0.5 + Math.sin(Date.now() * 0.001 * star.speed) * 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 255, 255, ${star.brightness * flicker})`;
                ctx.fill();
                
                // 輝く星
                if (star.size > 1.5) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${star.brightness * flicker * 0.3})`;
                    ctx.fill();
                }
                
                // ゆっくり動く
                star.y -= star.speed * 0.2;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            
            requestAnimationFrame(drawStars);
        }
        
        drawStars();
        
        // 浮遊パーティクル生成
        const particleContainer = document.getElementById('particles');
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            particleContainer.appendChild(particle);
            
            // アニメーション終了後に削除
            setTimeout(() => {
                particle.remove();
            }, 15000);
        }
        
        // 定期的にパーティクルを生成
        setInterval(createParticle, 500);
        
        // 初期パーティクル
        for (let i = 0; i < 20; i++) {
            setTimeout(createParticle, i * 100);
        }
        
        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
