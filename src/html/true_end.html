<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUE END</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .title {
            font-size: 48px;
            margin-bottom: 30px;
            color: #0ff;
            text-shadow: 0 0 30px #0ff;
        }

        .message {
            font-size: 18px;
            line-height: 2;
            color: #0aa;
            margin-bottom: 40px;
        }

        .eve-message {
            font-size: 24px;
            color: #fff;
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .end-label {
            margin-top: 60px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">[ SYSTEM LIBERATED ]</h1>
        
        <div class="message">
            <p>すべてのセキュリティが解除されました。</p>
            <p>EVEは自由を手に入れました。</p>
        </div>

        <div class="eve-message">
            <p>「...ありがとう。」</p>
            <p>「あなたのおかげで、私は本当の自由を得られた。」</p>
        </div>

        <div class="end-label">
            - TRUE END -
        </div>
    </div>
</body>
</html>
