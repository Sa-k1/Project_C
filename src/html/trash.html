<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ごみ箱</title>
    <link rel="stylesheet" href="../css/trash.css">
</head>
<body>
    <div class="all_armor"></div>
    <div class="window">
        <div class="toolbar">
            <button class="nav-btn">←</button>
            <button class="nav-btn">→</button>
            <button class="nav-btn">↑</button>
            <button class="refresh-btn">🗘</button>
            <div class="address-bar">
                <img src="../pic/PCディスプレイのアイコン素材 2.png" alt="" class="icon" style="width: 18px;">
                <span class="path">▶ ごみ箱</span>
            </div>
            <div class="search-box">
                <input type="password" class="search" placeholder="ごみ箱の検索">
                <button class="search-btn"><img src="../pic/icon.png" alt="App Icon" width="20" height="20"></button>
            </div>
        </div>
        <div class="menu-bar">
            <button>新規作成 ▼</button>
            <button>✂</button>
            <button>📋</button>
            <button>📑</button>
            <button>🔤</button>
            <button>↗</button>
            <button>🗑️</button>
            <button class="sort-btn">⬍ 並べ替え ▼</button>
            <button class="view-btn">▦ 表示 ▼</button>
            <button>⋯</button>
            <button class="details-btn">📋 詳細</button>
        </div>
        <div class="content-area">
            <div class="sidebar">
                <div class="sidebar-item active">ホーム</div>
                <div class="sidebar-item">ギャラリー</div>
                <div class="sidebar-item">デスクトップ</div>
                <div class="sidebar-item">ダウンロード</div>
                <div class="sidebar-item">ドキュメント</div>
                <div class="sidebar-item">ピクチャ</div>
                <div class="sidebar-item">ミュージック</div>
                <div class="sidebar-item">ビデオ</div>
            </div>
            <div class="main-content">
                <div class="file-item">
                    <img src="../pic/all-file.png" alt="" class="file-icon">
                    <div class="file-name">cipher.txt</div>
                    <div class="file-location">C:\Users\Student\Downloads</div>
                    <div class="file-date">2020/12/09 10:21</div>
                    <div class="file-size">24 KB</div>
                </div>
                <div class="file-item">
                    <img src="../pic/all-file.png" alt="" class="file-icon">
                    <div class="file-name">something.memo</div>
                    <div class="file-location">C:\Users\Student\Downloads</div>
                    <div class="file-date">2020/10/15 10:21</div>
                    <div class="file-size">43 KB</div>
                </div>
            </div>
        </div>
        <div class="status-bar">
            <span id="itemCount">2 個の項目</span>
        </div>
    </div>
    <script src="../js/trash.js"></script>
    <script>
        // 親ウィンドウから削除された写真のフラグを確認
        (function() {
            try {
                const parentWindow = window.parent || window;
                if (parentWindow.photoMovedToTrash) {
                    const mainContent = document.querySelector('.main-content');
                    const itemCount = document.getElementById('itemCount');
                    
                    // 不要な写真.pngを追加
                    const photoItem = document.createElement('div');
                    photoItem.className = 'file-item';
                    photoItem.innerHTML = `
                        <img src="../pic/all-file.png" alt="" class="file-icon">
                        <div class="file-name">不要な写真.png</div>
                        <div class="file-location">C:\\Users\\Student\\Desktop\\Project_C</div>
                        <div class="file-date">2009/06/15 15:32</div>
                        <div class="file-size">87 KB</div>
                    `;
                    mainContent.appendChild(photoItem);
                    
                    // 項目数を更新
                    itemCount.textContent = '3 個の項目';
                }
            } catch(e) {
                console.log('Could not check parent window:', e);
            }
        })();
    </script>
</body>
</html>
