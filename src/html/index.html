<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>E.V.E</title>
  <link rel="stylesheet" href="../css/styl.css">
  <link rel="stylesheet" href="../error_direction/virus.css">
  <!-- 追加：赤背景演出 -->
  <link rel="stylesheet" href="../error_direction/red-screen.css">
  <!-- 追加：脈動演出 -->
  <link rel="stylesheet" href="../error_direction/pulse.css">
</head>
<body>
  <div class="fade"></div>
  
  <!-- ターミナルと小窓をまとめるコンテナ -->
  <div class="window-container" id="windowContainer" style="display: none;">
    <!-- ターミナルに隣接する小窓（イラスト用）- 左側 -->
    <div class="side-panel" id="sidePanel">
      <div class="side-panel-content">
        <!-- ここにイラストを入れる -->
        <img id="side-panel-image" src="../pic/fotor-ai-2025112710534.gif" alt="EVE イラスト">
      </div>
    </div>
    
    <!-- メインのターミナルウィンドウ - 右側 -->
    <div class="mini-window" id="miniWindow">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active">
              <span class="tab-icon" aria-hidden="true"></span>
              <span class="tab-label">アシスタントAI : EVE</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">▢</button>
            <button class="ctrl close" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <p class="terminal"></p>
      <!-- コンソールを読み込む iframe（JS で src をセットします） -->
      <iframe id="mini-iframe" frameborder="0"></iframe>
    </div>
  </div>

  <div id="trash-can">
    <img src="../pic/ゴミ箱の無料アイコン.png" alt="ゴミ箱" id="trash-image">
    <button id="toggle-trash-content" class="trash-button">ゴミ箱を開く</button>
  </div>

  <!-- ここを追加/確認: EVE アイコン（クリックで子ウィンドウを開閉） -->
  <div class="eve">
    <img src="../pic/icon_E.png" alt="EVE" id="eve-image">
    <h1 class="word">E.V.E</h1>
  </div>
  
  <div id="trash-content" style="display: none;">
    <h3>🗑️ ゴミ箱の中身 (移動済み要素)</h3>
  </div>
    
  <div class="draggable-item" draggable="true" id="file1">
    <img src="../pic/file.png" alt="">  
    <h1 class="word">重要なデータ.txt</h1>
  </div>

  <div class="draggable-item" draggable="true" id="file2">
    <img src="../pic/file.png" alt="">  
    <h1 class="word">古いメモ.doc</h1>
  </div>
  
  <div class="draggable-item" draggable="true" id="file3">
    <img src="../pic/file.png" alt="">  
    <h1 class="word">不要な写真.jpg</h1>
  </div>

  <!-- ファイルビューア用ウィンドウコンテナ（file1用） -->
  <div class="file-viewer-container" id="fileViewerContainer1" style="display: none; top: 80px; right: 150px;">
    <div class="file-viewer-window" id="fileViewerWindow1">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active">
              <span class="tab-label" id="fileViewerTitle1">ファイル</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">▢</button>
            <button class="ctrl close" data-viewer="1" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe1" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ファイルビューア用ウィンドウコンテナ（file2用） -->
  <div class="file-viewer-container" id="fileViewerContainer2" style="display: none; top: 120px; right: 120px;">
    <div class="file-viewer-window" id="fileViewerWindow2">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active">
              <span class="tab-label" id="fileViewerTitle2">ファイル</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">▢</button>
            <button class="ctrl close" data-viewer="2" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe2" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ファイルビューア用ウィンドウコンテナ（file3用） -->
  <div class="file-viewer-container" id="fileViewerContainer3" style="display: none; top: 160px; right: 90px;">
    <div class="file-viewer-window" id="fileViewerWindow3">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active">
              <span class="tab-label" id="fileViewerTitle3">ファイル</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">▢</button>
            <button class="ctrl close" data-viewer="3" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe3" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ★ footer を body 内に移動 ★ -->
  <footer>
    <!-- 追加: 検索アイコンとラベル -->
    <div class="win_surch">
      <div class="app-pill">
        <img src="../pic/icon.png" alt="App Icon" width="20" height="20">
        <span>検索</span>
      </div>
      <div class="icon_taskb_all">
            <img class="i_task_bar secu" src="../pic/鉄壁のセキュリティアイコン.png" alt="">
            <img class="i_task_bar IE" src="../pic/ブラウザアイコン(IE).png" alt="">
            <img class="i_task_bar PDF" src="../pic/PDFファイルのフリーアイコン3.png" alt="">
            <img class="i_task_bar mail" src="../pic/メールのアイコン素材 その2.png" alt="">
            <img class="i_task_bar folder" src="../pic/線画のフォルダアイコン.png" alt="">
            <img class="i_task_bar DB" src="../pic/DBのアイコン素材.png" alt="">
            <img class="i_task_bar game" src="../pic/ゲームアイコン10.png" alt="">
      </div>
    </div>
  </footer>

  <!-- スクリプト（footer の後） -->
  <script src="../error_direction/virus-config.js"></script>
  <script src="../error_direction/virus.js"></script>
  <script src="../error_direction/red-screen.js"></script>
  <script src="../error_direction/pulse.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
