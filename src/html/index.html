<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>EVE</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="../css/styl.css">
  <link rel="stylesheet" href="../error_direction/virus.css">
  <!-- 追加：赤背景演出 -->
  <link rel="stylesheet" href="../error_direction/red-screen.css">
  <!-- 追加：脈動演出 -->
  <link rel="stylesheet" href="../error_direction/pulse.css">
</head>
<body>
  <div class="fade"></div>
  
  <!-- AI chat -->
  <div class="window-container" id="windowContainer" style="display: none;">
    <!-- メインのターミナルウィンドウ - 右側 -->
    <div class="mini-window" id="miniWindow" style="width: 815px; height: 500px;">
      <div class="box">
        <div class="titlebar" style="background-color: rgb(255, 255, 255); border: #0d1b2a 2px solid; position: absolute; left: -1px;">
          <div class="tabs">
            <div class="tab active" style="background-color: #fff; color: black;">
              <img src="../pic/icon_E_21.png" alt="" class="tab-icon">
              <span class="tab-label">アシスタントAI : EVE</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize no_play" style="color: #0d1b2a; cursor: default;">一</button>
            <button class="ctrl maximize no_play" style="color: #0d1b2a; cursor: default;">☐</button>
            <button class="ctrl close" title="閉じる" style="color: #0d1b2a;">✕</button>
          </div>
        </div>
      </div>
      <p class="terminal"></p>
      <!-- コンソールを読み込む iframe（JS で src をセットします） -->
      <iframe id="mini-iframe" frameborder="0"></iframe>
    </div>
  </div>


  <!-- ゴミ箱改装中 -->
  <div id="trash-can">
    <img src="../pic/ゴミ箱の無料アイコン.png" alt="ゴミ箱" id="trash-image" class="all_img">
    <h1 class="word word_trash">ごみ箱</h1>
  </div>

  <!-- ここを追加/確認: EVE アイコン（クリックで子ウィンドウを開閉） -->
  <div class="eve">
    <img src="../pic/icon_E.png" alt="EVE" id="eve-image" class="eve-image">
    <h1 class="word">E.V.E</h1>
  </div>
  
  <!-- MyDay, 重要なデータ.txt, 不要な写真.png はターミナルからsearchで探す -->
  <!-- file2 (MyDay) - C:\Users\Student\AppData\Local\MyDay\MyDay.app -->
  <!-- file1 (重要なデータ.txt) - C:\Users\Student\Documents\personal\重要なデータ.txt -->
  <!-- file3 (不要な写真.png) - C:\Users\Student\Pictures\old_photos\不要な写真.png -->

  <!-- ターミナルアイコン -->
  <div class="draggable-item terminal_icon" draggable="true" id="terminalIcon">
    <img src="../pic/gcfhjkl-removebg-preview.png" alt="" class="all_img">  
    <h1 class="word">terminal</h1>
  </div>

  <!-- チュートリアルアイコン（最初は非表示） -->
  <div class="draggable-item" draggable="true" id="tutorialIcon" style="display: none; top: -11px; position: absolute; right: 135px;">
    <img src="../pic/tyu.png" alt="" class="all_img">  
    <h1 class="word">README.md</h1>
  </div>

      <!-- 暗号化ファイルアイコン -->
  <div class="draggable-item" draggable="true" id="file_encrypted">
    <img src="../pic/_-removebg-preview.png" alt="" class="all_img" style="filter: hue-rotate(180deg);">
    <h1 class="word">frnepu.enc</h1>
  </div>

    <!-- ファイルビューア用ウィンドウコンテナ（ゴミ箱用） -->
  <div class="trash-viewer-container" id="trashViewerContainer" style="display: none; top: 160px; right: 90px;">
    <div class="file-viewer-window" id="trashViewerWindow" style="height: 500px; width: 850px;">
      <div class="box" style=" background-color: aliceblue;">
        <div class="titlebar" style="background-color: rgba(240, 248, 255, 0);">
          <div class="tabs" style="background-color: aliceblue;">
            <div class="tab active" style="background-color: rgba(233, 236, 239, 0); top: 0px; width: 150px;">
              <span class="tab-label" id="trashViewerTitle" style="color: black;  font-size: 18px;">ごみ箱</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize no_play"  style="color: black; cursor: default;">一</button>
            <button class="ctrl maximize no_play"  style="color: black; cursor: default;">☐</button>
            <button class="ctrl close" data-viewer="3" title="閉じる" style="color: black;">✕</button>
          </div>
        </div>
      </div>
      <iframe id="trash-viewer-iframe" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ファイルビューア用ウィンドウコンテナ（file1用） -->
  <div class="file-viewer-container" id="fileViewerContainer1" style="display: none; top: 80px; right: 150px;">

          <div class="window-controls">
            <button class="ctrl minimize no_play"  style="cursor: default;">一</button>
            <button class="ctrl maximize no_play"  style="cursor: default;">☐</button>
            <button class="ctrl close" data-viewer="1" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe1" frameborder="0"></iframe>
    </div>
  </div>

  <!-- ファイルビューア用ウィンドウコンテナ（file2用） -->

    <div class="file-viewer-window" id="fileViewerWindow2" style="height: 500px; border: 2px solid #333;">
      <div class="box">
        <div class="titlebar">

              <img class="tab-label" id="fileViewerTitle2" src="../pic/icon_MD.png" alt="">
              <span class="tab-label MyDay_logo">MyDay</span>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize no_play"  style="cursor: default;">一</button>

      </div>
      <iframe id="file-viewer-iframe2" frameborder="0"></iframe>

  <!-- ファイルビューア用ウィンドウコンテナ（file3用） -->
  <div class="file-viewer-container" id="fileViewerContainer3" style="display: none; top: 160px; right: 90px;">
    <div class="file-viewer-window" id="fileViewerWindow3" style="border: 2px solid #333; height: 475px;">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active">
              <span class="tab-label" id="fileViewerTitle3">ファイル</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize no_play"  style="cursor: default;">一</button>
            <button class="ctrl maximize no_play"  style="cursor: default;">☐</button>

  <!-- 暗号化ファイル用ウィンドウコンテナ -->

    <div class="file-viewer-window" id="fileViewerWindow4" style="height: 500px; width: 500px; border: 2px solid #333;">
      <div class="box">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active" style="background-color: #0d1b0d;">
              <span class="tab-label" id="fileViewerTitle4" style="color: #00ff00;">frnepu.enc</span>

          <div class="window-controls">

      <iframe id="file-viewer-iframe4" frameborder="0"></iframe>

  <!-- wires.html専用ウィンドウコンテナ（大画面） -->
  <div class="file-viewer-container" id="fileViewerContainer5" style="display: none; top: 30px; left: 30px;">
    <div class="file-viewer-window" id="fileViewerWindow5" style="height: 720px; width: 1280px; border: 2px solid #333;">
      <div class="box">
        <div class="titlebar" style="background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);">
          <div class="tabs">
            <div class="tab active" style="background-color: #0d1b2e;">
              <span class="tab-label" id="fileViewerTitle5" style="color: #7fffd4;">⚡ wires.html</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">☐</button>
            <button class="ctrl close" data-viewer="5" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe5" frameborder="0"></iframe>

  <!-- fragments.memo専用ウィンドウコンテナ -->

    <div class="file-viewer-window" id="fileViewerWindow6" style="height: 550px; width: 550px; border: 2px solid #00ff00;">
      <div class="box">
        <div class="titlebar" style="background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);">
          <div class="tabs">
            <div class="tab active" style="background-color: #0d0d0d;">
              <span class="tab-label" id="fileViewerTitle6" style="color: #00ff00;">📄 fragments.memo</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize" title="最小化">一</button>
            <button class="ctrl maximize" title="最大化">☐</button>
            <button class="ctrl close" data-viewer="6" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="file-viewer-iframe6" frameborder="0"></iframe>
    </div>
  </div>

  <!-- terminal window -->
  <div class="terminal-viewer-container" id="terminalViewerContainer" style="display: none; top: 100px; left: 100px;">
    <div class="file-viewer-window" id="terminalViewerWindow" style="height: 450px; width: 800px; border: 2px solid #333;">
      <div class="box">
        <div class="titlebar" style="background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); position: absolute; left: -1px;">
          <div class="tabs">
            <div class="tab active" style="background-color: #00000000; border: none;">
              <span class="tab-label" id="terminalViewerTitle" style="color: rgb(255, 255, 255); ">Console / Terminal</span>
            </div>
          </div>
          <div class="window-controls">
            <button class="ctrl minimize no_play"  style="cursor: default;">一</button>
            <button class="ctrl maximize no_play"  style="cursor: default;">☐</button>
            <button class="ctrl close" data-viewer="terminal" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="terminal-viewer-iframe" frameborder="0"></iframe>
    </div>

  <!-- チュートリアル用ウィンドウコンテナ -->
  <div class="file-viewer-container" id="tutorialViewerContainer" style="display: none; top: 120px; left: 300px;">
    <div class="file-viewer-window" id="tutorialViewerWindow" style="height: 550px; width: 700px; border: 2px solid #fff; background-color: #393939;">
      <div class="box" style="background-color: #00000000;">
        <div class="titlebar">
          <div class="tabs">
            <div class="tab active" style="background-color: #393939; border: none; width: 0;">
              <span class="tab-label" id="tutorialViewerTitle">README.md</span>
            </div>
          </div>
          <div class="window-controls">
            <!-- <button class="ctrl minimize no_play"  style="cursor: default;">一</button>
            <button class="ctrl maximize no_play"  style="cursor: default;">☐</button> -->
            <button class="ctrl close" data-viewer="tutorial" title="閉じる">✕</button>
          </div>
        </div>
      </div>
      <iframe id="tutorial-viewer-iframe" frameborder="0" style="width: 100%; height: calc(100% - 40px); border-top: 2px solid #fff;"></iframe>
    </div>
  </div>

  <!-- ★ footer を body 内に移動 ★ -->
  <footer>
    <!-- 追加: 検索アイコンとラベル -->
    <div class="win_surch">
      <div class="icon_taskb">
        <img src="../pic/win.png" alt="" class="i_task_bar win" title="スタート">
      </div>

      <div class="app-pill" title="検索">
        <img src="../pic/icon.png" alt="App Icon" width="20" height="20" title="検索">
        <input type="password" class="search" placeholder="検索">
      </div>
      <div class="icon_taskb_all">
        <img class="i_task_bar secu" id="sec" src="../pic/鉄壁のセキュリティアイコン.png" alt="" title="SUPER ARMOR">
        <img class="i_task_bar IE" src="../pic/edge.png" alt="" title="Microsoft Edge">
        <img class="i_task_bar PDF" src="../pic/Discord.png" alt="" title="Discord">
        <img class="i_task_bar mail" src="../pic/Line.png" alt="" title="LINE">
        <img class="i_task_bar folder" src="../pic/explorer.png" alt="" title="エクスプローラー">
        <img class="i_task_bar DB" src="../pic/twitter.png" alt="" title="Twitter">
        <img class="i_task_bar game" src="../pic/slack.png" alt="" title="slack">
      </div>

            <!-- 時計表示エリア -->
      <div class="taskbar-clock">
        <span id="clock-time">00:00</span>
        <span id="clock-date">0000/00/00</span>
        <span class="chat-badge" id="chatBadge" style="display: none;">1</span>
      </div>
    </div>
  </footer>

  <!-- EVE会話, 通知パネル -->
  <div class="notification-panel" id="notificationPanel">
    <div class="notification-header">
      <!-- <span class="notification-title">EVE</span> -->
      <span class="notification-title">通知</span>
      <button class="notification-close" id="notificationClose">✕</button>
    </div>
    <div class="notification-content" id="notificationContent">
      <!-- 会話がここに表示される -->
    </div>

    </div> -->
