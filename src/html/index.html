<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>E.V.E</title>
  <link rel="stylesheet" href="../css/styl.css">
</head>
<body>
  <div class="fade"></div>
  <div class="mini-window" id="miniWindow" style="display: none;">
    <div class="box">
      <div class="titlebar">
        <div class="tabs">
          <div class="tab active">
            <span class="tab-icon" aria-hidden="true"></span>
            <span class="tab-label">アシスタントAI : EVE</span>
          </div>

        </div>
        <div class="window-controls">
          <button class="ctrl minimize" title="最小化">一</button>
          <button class="ctrl maximize" title="最大化">▢</button>
          <button class="ctrl close" title="閉じる">✕</button>
        </div>
      </div>
    </div>
    <p class="terminal"></p>
    <!-- コンソールを読み込む iframe（JS で src をセットします） -->
    <iframe id="mini-iframe" frameborder="0" style="width:100%;height: 88%;display:block;"></iframe>
  </div>

  <div id="trash-can">
    <img src="../pic/ゴミ箱の無料アイコン.png" alt="ゴミ箱" id="trash-image">
    <button id="toggle-trash-content" class="trash-button">ゴミ箱を開く</button>
  </div>

  <!-- ここを追加/確認: EVE アイコン（クリックで子ウィンドウを開閉） -->
  <div id="eve">
    <img src="../pic/icon_E.png" alt="EVE" id="eve-image">
  </div>
  
  <div id="trash-content" style="display: none;">
    <h3>🗑️ ゴミ箱の中身 (移動済み要素)</h3>
  </div>
    
  <div class="draggable-item" draggable="true" id="file1">重要なデータ.txt</div>
  <div class="draggable-item" draggable="true" id="file2">古いメモ.doc</div>
  <div class="draggable-item" draggable="true" id="file3">不要な写真.jpg</div>

  <!-- iframe の読み込みは上の miniWindow 内の iframe を JS で行います -->
  <!-- script はここに1つだけ置く -->
  <script src="../js/index.js"></script>
</body>

<footer>
  <div class="win_surch">
    <div class="app-pill">
      <img src="../pic/flutter_dash.png" alt="app" />
      <span class="label">アシスタントAI · EVE</span>
    </div>
  </div>
  <!-- 追加: 検索アイコンとラベル -->
  <div class="win_surch">
    <div class="app-pill">
      <img src="../pic/icon.png" alt="App Icon" width="20" height="20">
      <span>検索</span>
    </div>
  </div>
</footer>
</html>
