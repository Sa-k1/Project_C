<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>親ウィンドウですわ</title>
  <link rel="stylesheet" href="../css/styl.css">
</head>
<body>
  <div class="mini-window" id="miniWindow" style="display: none;">
    <div class="box"></div>
    <p class="terminal">アシスタントAI： EVE</p>
    <textarea name="" id="" class="text"></textarea>
    <div class="icon_ALL">
      <img src="../pic/minimize.png" alt="" class="De">
      <img src="../pic/fullscreen.png" alt="" class="Bi">
      <img src="../pic/close.png" alt="" class="Sm">
    </div>
  </div>

  <div id="trash-can">
    <img src="../pic/ゴミ箱の無料アイコン.png" alt="ゴミ箱" id="trash-image">
    <button id="toggle-trash-content" class="trash-button">ゴミ箱を開く</button>
  </div>

  <!-- ここを追加/確認: EVE アイコン（クリックで子ウィンドウを開閉） -->
  <div id="eve">
    <img src="../pic/Gemini_Generated_Image_ro1q2oro1q2oro1q.png" alt="EVE" id="eve-image" style="width:64px;height:64px;cursor:pointer;">
  </div>
  
  <div id="trash-content" style="display: none;">
    <h3>🗑️ ゴミ箱の中身 (移動済み要素)</h3>
  </div>
    
  <div class="draggable-item" draggable="true" id="file1">重要なデータ.txt</div>
  <div class="draggable-item" draggable="true" id="file2">古いメモ.doc</div>
  <div class="draggable-item" draggable="true" id="file3">不要な写真.jpg</div>

  <iframe src="../html/mini.html" frameborder="0"></iframe>
  <!-- script はここに1つだけ置く -->
  <script src="../js/index.js"></script>
</body>

<footer>
  <div class="win_surch">
    
  </div>
</footer>
</html>
