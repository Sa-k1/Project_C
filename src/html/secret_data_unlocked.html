<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>解読済みデータ.txt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1a0a 0%, #152d15 100%);
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        
        .unlock-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(0, 255, 0, 0.8); }
            50% { text-shadow: 0 0 20px rgba(0, 255, 0, 1), 0 0 30px rgba(0, 255, 0, 0.5); }
        }
        
        .header-bar {
            background: #00ff00;
            color: #000;
            padding: 10px;
            margin: -30px -30px 20px -30px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        h1 {
            color: #00ff00;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .content-box {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .section-title {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }
        
        .important {
            color: #ffff00;
            font-weight: bold;
        }
        
        .hint {
            color: #88ff88;
            font-style: italic;
            margin-top: 15px;
            padding: 10px;
            border-left: 3px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #002200;
            border-left: 3px solid #00ff00;
        }
        
        .status-label {
            color: #00ff00;
            font-weight: bold;
        }
        
        .status-value {
            color: #88ff88;
        }
        
        .footer {
            margin-top: 20px;
            color: #666;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            解読成功 - アクセス許可
        </div>
        
        <div class="content-box">
            <div class="section-title">=== 機密情報 ===</div>
            
            <p>重要なコマンド: <span class="important">override</span></p>
            
            <div class="hint">
                ヒント: EVEが眠っている時、<br>
                　　　　システムは無防備になる
            </div>
        </div>
        
        <div class="status">
            <span class="status-label">ステータス: </span>
            <span class="status-value">解読完了 ✓</span>
        </div>
    </div>
</body>
</html>
