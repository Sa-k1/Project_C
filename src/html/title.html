<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE</title>
    <link rel="stylesheet" href="../css/title.css">
</head>
<body>
    <div class="title-container">
    <h1 class="game-title">EVE</h1>
    <!-- <img src="../pic/d-removebg-preview.png" alt="" class="game-title"></img> -->
    </div>

    <div class="start-container">
        <button class="start-button" id="startBtn">start</button>
    </div>
    <script src="../js/save_system.js"></script>
    <script>
        const { ipcRenderer } = require('electron');
        const startButton = document.getElementById('startBtn');

        startButton.addEventListener('click', function() {
            startButton.classList.add('clicked');
            
            // 「最初から」を選択したのでセーブデータを削除
            if (window.saveSystem) {
                window.saveSystem.clear();
                console.log('タイトルからスタート: セーブデータを削除しました');
            }
            
            // フェードアウト開始と同時にスプラッシュのアニメーションを開始
            ipcRenderer.send('prepare-splash');
            
            // フェードアウトを開始
            document.body.classList.add('fade-out');
            
            // フェードアウト完了後に画面切り替え
            setTimeout(() => {
                ipcRenderer.send('game-start');
            }, 1000);
        });
    </script>
</body>
</html>
