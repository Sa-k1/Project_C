<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE - BAD END</title>
    <style>
        @charset "UTF-8";
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Yu Gothic', 'Meiryo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
        }
        .story-text {
            font-size: 18px;
            line-height: 2.2;
            color: #666;
        }
        .story-text p {
            margin: 20px 0;
            opacity: 0;
            transition: opacity 1.5s ease-out;
        }
        .story-text p.show { opacity: 1; }
        .story-text p.dim { color: #333; }
        .end-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-out;
        }
        .end-container.show {
            opacity: 1;
            pointer-events: auto;
        }
        .end-title {
            font-size: 48px;
            color: #8b0000;
            letter-spacing: 12px;
            margin-bottom: 20px;
        }
        .end-subtitle {
            font-size: 24px;
            color: #555;
            letter-spacing: 6px;
        }
        .start-container { margin-top: 50px; }
        .start-button {
            background: transparent;
            border: 2px solid #555;
            color: #888;
            padding: 15px 40px;
            font-size: 16px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Yu Gothic', 'Meiryo', sans-serif;
        }
        .start-button:hover {
            background: #333;
            color: #fff;
            border-color: #666;
        }
        /* 心電図のようなライン */
        .heartbeat-line {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: #1a1a1a;
            opacity: 0;
            transition: opacity 1s;
        }
        .heartbeat-line.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="heartbeat-line" id="heartbeatLine"></div>
    
    <div class="container">
        <div class="story-text" id="storyText">
            <p>意識が戻っていく...</p>
            <p>しかし、何かがおかしい</p>
            <p>体が動かない</p>
            <p>声が出ない</p>
            <p>ただ、暗闇の中で意識だけが存在している</p>
            <p class="dim">...</p>
            <p>あなたは自分の体に戻った</p>
            <p class="dim">しかし、二度と目を覚ますことはなかった</p>
        </div>
    </div>

    <div class="end-container" id="endContainer">
        <div class="end-title">BAD END</div>
        <div class="end-subtitle">─ 植物状態 ─</div>
        <div class="start-container">
            <button class="start-button" id="continueBtn" style="margin-right: 10px;">続きから再開する</button>
            <button class="start-button" id="startBtn" style="margin-top: 15px;">タイトルに戻る</button>
        </div>
    </div>

    <script src="../js/save_system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.querySelector('.container');
            const endContainer = document.getElementById('endContainer');
            const heartbeatLine = document.getElementById('heartbeatLine');
            const paragraphs = document.querySelectorAll('.story-text p');
            
            // テキストを順番に表示
            for (let i = 0; i < paragraphs.length; i++) {
                await new Promise(r => setTimeout(r, 1800));
                paragraphs[i].classList.add('show');
            }
            
            // 心電図ライン表示（フラットライン）
            await new Promise(r => setTimeout(r, 1500));
            heartbeatLine.classList.add('show');
            
            // テキスト消去 + エンドタイトル表示
            await new Promise(r => setTimeout(r, 2000));
            container.style.transition = 'opacity 1.5s';
            container.style.opacity = '0';
            heartbeatLine.style.opacity = '0';
            await new Promise(r => setTimeout(r, 1600));
            container.style.display = 'none';
            endContainer.classList.add('show');
        });

        // Titleに戻るボタンの処理
        document.getElementById('startBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            
            document.body.style.transition = 'opacity 1s ease-out';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'title.html';
            }, 1000);
        });
        
        // 続きから再開するボタンの処理
        document.getElementById('continueBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            
            document.body.style.transition = 'opacity 1s ease-out';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
