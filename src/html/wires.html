<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>通信プロトコル修正</title>
  <style>
      /* 成功時の全体フラッシュ演出 */
      body.success-flash {
        animation: success-flash 1.2s cubic-bezier(0.4,0,0.2,1);
      }
      @keyframes success-flash {
        0% { background: #0a0a12; }
        10% { background: #00ffae44; }
        30% { background: #00ffae99; }
        60% { background: #0a0a12; }
        100% { background: #0a0a12; }
      }
    * { box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #e0e0e0;
      font-family: 'Consolas', 'monospace';
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }
    /* バイナリノイズ背景 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,255,128,0.04) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, rgba(0,255,128,0.04) 0 2px, transparent 2px 4px);
      animation: scanlines 2s linear infinite;
    }
    @keyframes scanlines {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 4px, 4px 0; }
    }
    
    .main-container {
      display: flex;
      height: 100%;
      padding: 10px;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    
    /* 左側：情報パネル */
    .info-panel {
      width: 200px;
      background: #12121e;
      border-radius: 0;
      padding: 12px;
      border: 2.5px solid #00ffae;
      box-shadow: 0 0 0 2px #0a0a12, 0 0 12px #00ffae44;
      display: flex;
      flex-direction: column;
      gap: 8px;
      outline: 2px solid #00ffae44;
    }
    
    .panel-title {
      font-size: 1em;
      color: #00ffae;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 2px solid #00ffae;
      letter-spacing: 2px;
      font-family: 'Consolas', 'monospace';
      text-shadow: 0 0 8px #00ffae99;
      border-radius: 0;
    }
    .panel-title.success {
      color: #7fffd4;
      text-shadow: 0 0 8px #7fffd4;
    }
    
    .error-box {
      background: rgba(0,255,128,0.08);
      border: 2px solid #00ffae;
      border-radius: 0;
      padding: 8px;
      color: #00ffae;
      font-size: 0.75em;
      font-family: 'Consolas', 'monospace';
      text-shadow: 0 0 6px #00ffae99;
    }
    .error-box.success {
      background: rgba(127, 255, 212, 0.1);
      border-color: #7fffd4;
      color: #7fffd4;
      text-shadow: 0 0 8px #7fffd4;
    }
    
    .status-log {
      background: #0a0a12;
      border: 2px solid #00ffae;
      border-radius: 0;
      padding: 8px;
      font-size: 0.7em;
      line-height: 1.5;
      flex: 1;
      overflow-y: auto;
      font-family: 'Consolas', 'monospace';
      color: #00ffae;
      box-shadow: 0 0 8px #00ffae33 inset;
      text-shadow: 0 0 4px #00ffae99;
    }
    .status-log .log-line {
      margin-bottom: 4px;
      padding: 2px 0;
      border-bottom: 1px solid #222;
    }
    .status-log .error { color: #ff6666; }
    .status-log .success { color: #7fffd4; }
    .status-log .info { color: #00bcd4; }
    .status-log .warning { color: #f1c40f; }
    
    .status-panel {
      background: #1a1a2e;
      border-radius: 0;
      padding: 10px;
      text-align: center;
      border: 2px solid #00ffae;
      font-family: 'Consolas', 'monospace';
      color: #00ffae;
      box-shadow: 0 0 8px #00ffae33 inset;
    }
    .status-panel .label {
      font-size: 0.7em;
      color: #888;
      margin-bottom: 4px;
    }
    .status-panel .value {
      font-size: 1.2em;
      font-weight: bold;
      color: #ff6666;
    }
    .status-panel.complete .value {
      color: #2ecc71;
      animation: pulse-text 1s infinite;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .reset-btn {
      width: 100%;
      background: #0a0a12;
      color: #00ffae;
      border: 2px solid #00ffae;
      border-radius: 0;
      padding: 8px;
      cursor: pointer;
      font-size: 0.8em;
      font-family: 'Consolas', 'monospace';
      letter-spacing: 2px;
      transition: all 0.2s;
      text-shadow: 0 0 6px #00ffae99;
      box-shadow: 0 0 8px #00ffae33 inset;
    }
    .reset-btn:hover {
      background: #222;
      border-color: #7fffd4;
      color: #7fffd4;
      text-shadow: 0 0 8px #7fffd4;
    }
    
    /* 右側：パズルエリア */
    .puzzle-wrapper {
      flex: 1;
      background: #12121e;
      border-radius: 0;
      border: 2.5px solid #00ffae;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 2px #0a0a12, 0 0 12px #00ffae44;
      outline: 2px solid #00ffae44;
    }
    
    .puzzle-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(127, 255, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127, 255, 212, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    
    /* ヘッダーラベル */
    .column-header {
      position: absolute;
      top: 10px;
      font-size: 0.85em;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 0;
      background: rgba(0,0,0,0.7);
      border: 2px solid #00ffae;
      color: #00ffae;
      letter-spacing: 2px;
      font-family: 'Consolas', 'monospace';
      text-shadow: 0 0 8px #00ffae99;
    }
    .column-header.left {
      left: 80px;
      color: #00bcd4;
      border: 1px solid #00bcd4;
    }
    .column-header.right {
      right: 80px;
      color: #9b59b6;
      border: 1px solid #9b59b6;
    }
    
    /* 端子カラム */
    .terminal-column {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .terminal-column.left { left: 60px; }
    .terminal-column.right { right: 60px; }
    
    .terminal {
      width: 130px;
      height: 48px;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85em;
      color: #00ffae;
      text-shadow: 0 0 8px #00ffae99;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2.5px solid #00ffae;
      position: relative;
      letter-spacing: 2px;
      background: #0a0a12;
      box-shadow: 0 0 8px #00ffae33 inset;
      font-family: 'Consolas', 'monospace';
    }
    
    /* 左側（VR）の端子 */
    .terminal.vr {
      background: #0a0a12;
      border-color: #00ffae;
    }
    .terminal.vr::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 6px;
      background: #00ffae;
      top: 50%;
      right: -18px;
      transform: translateY(-50%);
      border-radius: 0;
    }
    
    /* 右側（PC）の端子 */
    .terminal.pc {
      background: #0a0a12;
      border-color: #00ffae;
    }
    .terminal.pc::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 6px;
      background: #00ffae;
      top: 50%;
      left: -18px;
      transform: translateY(-50%);
      border-radius: 0;
    }
    
    .terminal:hover:not(.connected) {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffae, 0 0 30px #00ffae44;
      border-color: #7fffd4;
    }
    .terminal.selected {
      transform: scale(1.08);
      box-shadow: 0 0 20px #00ffae, 0 0 30px #00ffae99;
      border-color: #7fffd4;
      animation: terminal-pulse 0.8s infinite;
    }
    @keyframes terminal-pulse {
      0%, 100% { box-shadow: 0 0 20px #00ffae; }
      50% { box-shadow: 0 0 30px #00ffae, 0 0 40px #00ffae99; }
    }
    .terminal.connected {
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(1);
      border-color: #555;
      color: #555;
      text-shadow: none;
    }
    .terminal.connected.correct::before {
      content: '■';
      position: absolute;
      font-size: 1.2em;
      color: #2ecc71;
      left: 4px;
      top: 4px;
    }
    .terminal.connected.wrong::before {
      content: '■';
      position: absolute;
      font-size: 1.2em;
      color: #ff6666;
      left: 4px;
      top: 4px;
    }
    
    /* SVGワイヤー */
    #wire-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .wire {
      fill: none;
      stroke-width: 4;
      stroke-linecap: square;
      filter: drop-shadow(0 0 3px #00ffae);
      transition: stroke 0.3s;
      stroke: #00ffae;
    }
    .wire.correct {
      stroke: #2ecc71 !important;
      filter: drop-shadow(0 0 6px #2ecc71);
    }
    .wire.wrong {
      stroke: #ff6666 !important;
      filter: drop-shadow(0 0 6px #ff6666);
    }
    .wire.pending {
      stroke: #888;
      stroke-dasharray: 8, 4;
      animation: dash-flow 0.5s linear infinite;
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -12; }
    }
    
    /* エラーフラッシュ */
    .error-flash {
      animation: error-shake 0.5s;
    }
    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    
    /* 完了演出 */
    .complete-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,255,128,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fade-in 0.5s;
      border: 2.5px solid #00ffae;
      border-radius: 0;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .complete-message {
      background: rgba(0, 0, 0, 0.95);
      border: 2.5px solid #00ffae;
      border-radius: 0;
      padding: 30px 50px;
      text-align: center;
      font-family: 'Consolas', 'monospace';
      color: #00ffae;
      text-shadow: 0 0 8px #00ffae99;
      letter-spacing: 2px;
    }
    .complete-message h2 {
      color: #2ecc71;
      margin: 0 0 10px 0;
      font-size: 1.5em;
    }
    .complete-message p {
      color: #7fffd4;
      margin: 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 左パネル：情報表示 -->
    <div class="info-panel">
      <div class="panel-title" id="panelTitle">
        ⚠ 接続エラー
      </div>
      
      <div class="error-box" id="errorBox">
        <strong>ERROR 0x8007</strong><br>
        通信プロトコル不一致<br>
        ケーブル接続を確認してください
      </div>
      
      <div class="status-log" id="statusLog">
        <div class="log-line info">[SYSTEM] 起動中...</div>
        <div class="log-line info">[SYSTEM] VR接続開始</div>
        <div class="log-line error">[ERROR] プロトコル検証失敗</div>
        <div class="log-line warning">[WARN] 接続不安定</div>
        <div class="log-line info">[INFO] 手動修正が必要です</div>
      </div>
      
      <div class="status-panel" id="statusPanel">
        <div class="label">接続状態</div>
        <div class="value" id="connectionStatus">0 / 5</div>
      </div>
      

    </div>
    
    <!-- 右側：パズルエリア -->
    <div class="puzzle-wrapper" id="puzzleWrapper">
      <div class="column-header left">VR</div>
      <div class="column-header right">PC</div>
      
      <svg id="wire-svg"></svg>
      
      <div class="terminal-column left" id="leftColumn"></div>
      <div class="terminal-column right" id="rightColumn"></div>
    </div>
  </div>

  <script>
  (function() {
    // プロトコルペア定義（左 + 右 + 2 = 100000000）
    // VR + PC = 11111110 (254)、それに2を足すと100000000 (256)
    const protocolPairs = [
      { vr: '10110001', pc: '01001101', id: 0 },  // 177 + 77 = 254
      { vr: '11001010', pc: '00110100', id: 1 },  // 202 + 52 = 254
      { vr: '10101100', pc: '01010010', id: 2 },  // 172 + 82 = 254
      { vr: '11100011', pc: '00011011', id: 3 },  // 227 + 27 = 254
      { vr: '10011110', pc: '01100000', id: 4 }   // 158 + 96 = 254
    ];
    
    let vrTerminals = [];
    let pcTerminals = [];
    let connections = []; // { vrId, pcId, wireEl, correct }
    let selectedVr = null;
    let correctCount = 0;
    // 回答済みフラグ（親windowのgameStateにも反映）
    function setWiresAnswered() {
      try {
        if (window.parent && window.parent.gameState) {
          window.parent.gameState.wiresAnswered = true;
        }
      } catch(e) {}
    }
    
    const puzzleWrapper = document.getElementById('puzzleWrapper');
    const wireSvg = document.getElementById('wire-svg');
    const leftColumn = document.getElementById('leftColumn');
    const rightColumn = document.getElementById('rightColumn');
    const statusLog = document.getElementById('statusLog');
    const connectionStatus = document.getElementById('connectionStatus');
    const statusPanel = document.getElementById('statusPanel');
    const panelTitle = document.getElementById('panelTitle');
    const errorBox = document.getElementById('errorBox');
    const resetBtn = document.getElementById('resetBtn');
    
    // 配列シャッフル
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    
    // ログ追加
    function addLog(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = message;
      statusLog.appendChild(line);
      statusLog.scrollTop = statusLog.scrollHeight;
    }
    
    // 初期化
    function init() {
      leftColumn.innerHTML = '';
      rightColumn.innerHTML = '';
      wireSvg.innerHTML = '';
      connections = [];
      selectedVr = null;
      correctCount = 0;
      
      // 端子作成
      vrTerminals = shuffle([...protocolPairs]);
      pcTerminals = shuffle([...protocolPairs]);
      
      vrTerminals.forEach((pair, index) => {
        const terminal = document.createElement('div');
        terminal.className = 'terminal vr';
        terminal.textContent = pair.vr;
        terminal.dataset.id = pair.id;
        terminal.dataset.index = index;
        terminal.addEventListener('click', () => selectVr(terminal, pair));
        leftColumn.appendChild(terminal);
      });
      
      pcTerminals.forEach((pair, index) => {
        const terminal = document.createElement('div');
        terminal.className = 'terminal pc';
        terminal.textContent = pair.pc;
        terminal.dataset.id = pair.id;
        terminal.dataset.index = index;
        terminal.addEventListener('click', () => selectPc(terminal, pair));
        rightColumn.appendChild(terminal);
      });
      
      updateStatus();
      
      // ログリセット
      statusLog.innerHTML = '';
      addLog('[SYSTEM] 起動中...', 'info');
      addLog('[SYSTEM] VR接続開始', 'info');
      addLog('[ERROR] プロトコル検証失敗', 'error');
      addLog('[WARN] 接続不安定', 'warning');
      addLog('[INFO] 手動修正が必要です', 'info');
      
      panelTitle.textContent = '⚠ 接続エラー';
      panelTitle.classList.remove('success');
      errorBox.innerHTML = '<strong>ERROR 0x8007</strong><br>通信プロトコル不一致<br>ケーブル接続を確認してください';
      errorBox.classList.remove('success');
      statusPanel.classList.remove('complete');
      
      // 完了オーバーレイ削除
      const overlay = puzzleWrapper.querySelector('.complete-overlay');
      if (overlay) overlay.remove();
    }
    
    // VR端子選択
    function selectVr(terminal, pair) {
      if (terminal.classList.contains('connected')) return;
      
      // 既存選択解除
      document.querySelectorAll('.terminal.selected').forEach(t => t.classList.remove('selected'));
      
      terminal.classList.add('selected');
      selectedVr = { terminal, pair };
      addLog(`[SELECT] VR: ${pair.vr}`, 'info');
    }
    
    // PC端子選択
    function selectPc(terminal, pair) {
      if (terminal.classList.contains('connected')) return;
      if (!selectedVr) {
        addLog('[WARN] 先にVR端子を選択してください', 'warning');
        return;
      }
      
      const vrPair = selectedVr.pair;
      const vrTerminal = selectedVr.terminal;
      
      // 接続判定
      const isCorrect = vrPair.id === pair.id;
      
      // ワイヤー描画
      const wire = drawWire(vrTerminal, terminal, isCorrect);
      
      // 接続記録
      connections.push({
        vrId: vrPair.id,
        pcId: pair.id,
        wireEl: wire,
        correct: isCorrect
      });
      
      // 端子状態更新
      vrTerminal.classList.add('connected');
      terminal.classList.add('connected');
      
      if (isCorrect) {
        vrTerminal.classList.add('correct');
        terminal.classList.add('correct');
        correctCount++;
        addLog(`[SUCCESS] 接続成功: ${vrPair.vr} ↔ ${pair.pc}`, 'success');
      } else {
        vrTerminal.classList.add('wrong');
        terminal.classList.add('wrong');
        addLog(`[ERROR] 接続失敗: ${vrPair.vr} ↔ ${pair.pc}`, 'error');
        puzzleWrapper.classList.add('error-flash');
        setTimeout(() => puzzleWrapper.classList.remove('error-flash'), 500);
      }
      
      selectedVr.terminal.classList.remove('selected');
      selectedVr = null;
      
      updateStatus();
      
      // 全接続完了チェック
      if (connections.length === protocolPairs.length) {
        checkComplete();
      }
    }
    
    // ワイヤー描画
    function drawWire(vrEl, pcEl, isCorrect) {
      const vrRect = vrEl.getBoundingClientRect();
      const pcRect = pcEl.getBoundingClientRect();
      const wrapperRect = puzzleWrapper.getBoundingClientRect();
      
      const x1 = vrRect.right - wrapperRect.left;
      const y1 = vrRect.top + vrRect.height / 2 - wrapperRect.top;
      const x2 = pcRect.left - wrapperRect.left;
      const y2 = pcRect.top + pcRect.height / 2 - wrapperRect.top;
      
      const midX = (x1 + x2) / 2;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
      path.classList.add('wire');
      
      if (isCorrect) {
        path.classList.add('correct');
      } else {
        path.classList.add('wrong');
      }
      
      wireSvg.appendChild(path);
      return path;
    }
    
    // ステータス更新
    function updateStatus() {
      connectionStatus.textContent = `${correctCount} / ${protocolPairs.length}`;
    }
    
    // 完了チェック
    let wiresAnswered = false;
    function checkComplete() {
      if (wiresAnswered) return;
      wiresAnswered = true;
      setWiresAnswered();
      // 親windowのgameStateにも反映
      try {
        if (window.parent && window.parent.gameState) {
          window.parent.gameState.wiresAnswered = true;
        }
      } catch(e) {}
      if (correctCount === protocolPairs.length) {
        // 成功演出
        panelTitle.textContent = '✓ ACCESS GRANTED';
        panelTitle.classList.add('success');
        errorBox.innerHTML = '<strong>STATUS: OK</strong><br>通信プロトコル正常<br>VR接続が確立されました';
        errorBox.classList.add('success');
        statusPanel.classList.add('complete');
        // 大きな演出
        const overlay = document.createElement('div');
        overlay.className = 'complete-overlay';
        overlay.innerHTML = `
          <div class="complete-message" style="font-size:2.2em; color:#00ffae; animation: pop-in 0.7s;">
            <h2 style="font-size:2.5em; margin-bottom:0.5em;">ACCESS GRANTED</h2>
            <p style="font-size:1.1em;">VR接続が正常に回復しました</p>
          </div>
        `;
        puzzleWrapper.appendChild(overlay);

        // 成功時の全体フラッシュ
        document.body.classList.add('success-flash');
        setTimeout(() => document.body.classList.remove('success-flash'), 1200);

        // 効果音（成功SE）
        try {
          const audio = new Audio('https://cdn.pixabay.com/audio/2022/07/26/audio_124bfae7e2.mp3');
          audio.volume = 0.5;
          audio.play();
        } catch(e) {}

        // 親ウィンドウに通知
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'wiresComplete', success: true }, '*');
        }
        setTimeout(() => { window.close(); }, 2000);
        @keyframes pop-in {
          0% { transform: scale(0.7); opacity: 0; }
          60% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
      } else {
        // 失敗演出（赤色＆自動でタブ閉じる）
        panelTitle.textContent = '✗ ACCESS DENIED';
        panelTitle.classList.remove('success');
        errorBox.innerHTML = '<strong>ERROR</strong><br>接続失敗<br>ウィンドウが自動で閉じます';
        errorBox.classList.remove('success');
        statusPanel.classList.remove('complete');
        // 大きな演出
        const overlay = document.createElement('div');
        overlay.className = 'complete-overlay';
        overlay.innerHTML = `
          <div class="complete-message" style="font-size:2.2em; color:#ff2222;">
            <h2 style="font-size:2.5em; margin-bottom:0.5em; color:#ff2222;">ACCESS DENIED</h2>
            <p style="font-size:1.1em; color:#ff6666;">接続に失敗しました</p>
          </div>
        `;
        puzzleWrapper.appendChild(overlay);
        setTimeout(() => { window.close(); }, 2000);
      }
    }
    
    // リセット

    
    // 初期化実行
    init();
  })();
  </script>
