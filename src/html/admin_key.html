<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>corrupted_memo.dat</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            height: 100vh;
            box-sizing: border-box;
            overflow: auto;
        }
        
        .header {
            color: #555;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        
        .content {
            line-height: 1.8;
        }
        
        .hint {
            color: #666;
            margin: 20px 0;
            padding: 15px;
            border-left: 2px solid #444;
            background: rgba(255,255,255,0.02);
        }
        
        .binary {
            color: #4a9;
            font-size: 16px;
            letter-spacing: 2px;
            margin: 15px 0;
        }
        
        .note {
            color: #555;
            font-size: 12px;
            margin-top: 30px;
            font-style: italic;
        }
        
        .symbol {
            display: inline-block;
            margin: 5px 10px 5px 0;
        }
        
        .symbol-star {
            color: #aa0;
        }
        
        .symbol-star-outline {
            color: #0aa;
        }
    </style>
</head>
<body>
    <div class="header">
        [corrupted_memo.dat] - 破損したメモファイル
    </div>
    
    <div class="content">
        <p>このメモは部分的に破損しています。</p>
        <p>復元可能なデータ:</p>
        
        <div class="hint">
            <p>
                <span class="symbol symbol-star">★</span> = <span class="binary">0</span>
            </p>
            <p>
                <span class="symbol symbol-star-outline">☆</span> = <span class="binary">1</span>
            </p>
        </div>
        
        <div class="hint">
            <p>メモ:</p>
            <p style="color: #777;">0→0→1→1→0→1</p>

        </div>
        
    </div>
</body>
</html>
