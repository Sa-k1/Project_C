 <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EVE - Final Puzzle</title>
    <link rel="stylesheet" href="../css/last_nazo.css">
</head>
<body>
<!-- 謎解きUI -->
    <div id="puzzle-overlay">
        <div class="puzzle-container">
            <h2 class="puzzle-title">【 解除プロセス開始 】</h2>
            
            <!-- タイマー表示 -->
            <div class="timer-section">
                <span class="timer-label">残り時間：</span>
                <span class="timer-value" id="timer-display">40.0</span>
                <span class="timer-unit">秒</span>
            </div>
            
            <div class="all">
                <!-- ダイヤル要素 -->
                <div class="puzzle-section dial-section">
                    <h3>ロック制御</h3>
                    <div class="dials-container">
                        <div class="dial-wrapper">
                            <button class="dial-btn dial-up" data-dial="0" data-dir="up">▲</button>
                            <div class="dial" data-dial="0">
                                <span class="dial-value">0</span>
                            </div>
                            <button class="dial-btn dial-down" data-dial="0" data-dir="down">▼</button>
                            <div class="dial-status" data-dial="0"></div>
                        </div>
                        <div class="dial-wrapper">
                            <button class="dial-btn dial-up" data-dial="1" data-dir="up">▲</button>
                            <div class="dial" data-dial="1">
                                <span class="dial-value">0</span>
                            </div>
                            <button class="dial-btn dial-down" data-dial="1" data-dir="down">▼</button>
                            <div class="dial-status" data-dial="1"></div>
                        </div>
                        <div class="dial-wrapper">
                            <button class="dial-btn dial-up" data-dial="2" data-dir="up">▲</button>
                            <div class="dial" data-dial="2">
                                <span class="dial-value">0</span>
                            </div>
                            <button class="dial-btn dial-down" data-dial="2" data-dir="down">▼</button>
                            <div class="dial-status" data-dial="2"></div>
                        </div>
                    </div>
                    <div class="section-status" id="dial-complete" style="    margin: 43px 0 0 25%; width: 50%;">✕</div>
                </div>

                <!-- クリック連打要素 -->
                <div class="puzzle-section click-section">
                    <h3>強制アクセス</h3>
                    <button class="click-target" id="click-target">
                        <span>信号送信</span>
                    </button>
                    <div class="click-progress">
                        <div class="click-bar" id="click-bar"></div>
                    </div>
                    <div class="click-counter"><span id="click-count">0</span> / 20</div>
                    <div class="section-status" id="click-complete">✕</div>
                </div>

                <!-- 長押し要素 -->
                <div class="puzzle-section hold-section">
                    <h3>権限認証</h3>
                    <button class="hold-target" id="hold-target">
                        <span>信号維持</span>
                    </button>
                    <div class="hold-progress">
                        <div class="hold-bar" id="hold-bar"></div>
                    </div>
                    <div class="hold-timer"><span id="hold-time">0.0</span> / 5.0 秒</div>
                    <div class="section-status" id="hold-complete" style="margin: 45px 0 0 25%; width: 50%;">✕</div>
                </div>
            </div>

            <!-- 全体ステータス -->
            <div class="puzzle-final-status" id="final-status">
                セキュリティ: <span id="security-status">アクセス不可</span>
            </div>
        </div>
    </div>
    <script src="../js/eve_puzzle_auto.js"></script>
</body>
</html>
