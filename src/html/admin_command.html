<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE</title>
    <link rel="stylesheet" href="../css/admin_command.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>[ 管理者権限コマンド入力 ]</h1>
            <div class="warning">⚠ WARNING: 不正なコマンドはシステム崩壊を招く可能性があります ⚠</div>
        </div>

        <div class="status-bar">
            <div class="status">
                <div class="dot"></div>
                <span>SYSTEM: ACTIVE</span>
            </div>
            <div class="status">
                <span>AUTH LEVEL: ADMIN</span>
            </div>
        </div>

        <div class="hint-section">
            <h3>[HINT] 管理者権限コマンドの構文</h3>
            <p>
                正しい管理者権限コマンドは以下の形式で構成されます:<br><br>
                <code>ADMIN_EXEC --auth [認証コード] --target [対象] --mode [モード]</code><br><br>
                ※ 脆弱性のあるコマンドはシステムに深刻な被害を与える可能性があります。
            </p>
        </div>

        <div class="input-section">
            <label class="input-label">コマンドを入力してください:</label>
            <div class="input-wrapper">
                <span class="input-prefix">$&gt;</span>
                <input type="text" id="command-input" placeholder="ADMIN_EXEC --auth ... --target ... --mode ..." autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div class="button-section">
            <button class="btn" id="execute-btn">EXECUTE</button>
            <button class="btn btn-cancel" id="cancel-btn">CANCEL</button>
        </div>

        <div class="loading" id="loading">
            <span>処理中</span>
            <span class="loading-dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </div>

        <div id="result-display"></div>
    </div>

    <script src="../js/admin_command.js"></script>
</body>
</html>
