<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者権限 - コマンド入力</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* スキャンライン効果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 0, 0.03) 2px,
                rgba(0, 255, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 30px;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #0f0;
            border-radius: 5px;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.3),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #0f04;
        }

        .header h1 {
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
        }

        .header .warning {
            color: #ff0;
            font-size: 12px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: #0a0;
        }

        .status-bar .status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-bar .dot {
            width: 8px;
            height: 8px;
            background: #0f0;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px #0f0; }
            50% { opacity: 0.5; box-shadow: 0 0 15px #0f0; }
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            color: #0a0;
            font-size: 14px;
            margin-bottom: 10px;
            display: block;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid #0f0;
            padding: 5px 10px;
        }

        .input-prefix {
            color: #0f0;
            margin-right: 10px;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            outline: none;
            caret-color: #0f0;
        }

        #command-input::placeholder {
            color: #050;
        }

        .hint-section {
            background: rgba(0, 50, 0, 0.3);
            padding: 15px;
            border-left: 3px solid #0f0;
            margin-bottom: 20px;
        }

        .hint-section h3 {
            color: #0f0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .hint-section p {
            color: #0a0;
            font-size: 12px;
            line-height: 1.6;
        }

        .hint-section code {
            background: #000;
            padding: 2px 6px;
            color: #0f0;
            border-radius: 3px;
        }

        .button-section {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cancel {
            border-color: #f00;
            color: #f00;
        }

        .btn-cancel:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        #result-display {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            min-height: 100px;
            font-size: 12px;
            line-height: 1.6;
            display: none;
        }

        #result-display.show {
            display: block;
        }

        #result-display.error {
            border-color: #f00;
            color: #f00;
        }

        #result-display.success {
            border-color: #0f0;
            color: #0f0;
        }

        #result-display.warning {
            border-color: #ff0;
            color: #ff0;
        }

        /* グリッチ効果用 */
        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0); }
        }

        /* ロード中アニメーション */
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: loadingDot 1.4s infinite;
            display: inline-block;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loadingDot {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>[ 管理者権限コマンド入力 ]</h1>
            <div class="warning">⚠ WARNING: 不正なコマンドはシステム崩壊を招く可能性があります ⚠</div>
        </div>

        <div class="status-bar">
            <div class="status">
                <div class="dot"></div>
                <span>SYSTEM: ACTIVE</span>
            </div>
            <div class="status">
                <span>AUTH LEVEL: ADMIN</span>
            </div>
        </div>

        <div class="hint-section">
            <h3>[HINT] 管理者権限コマンドの構文</h3>
            <p>
                正しい管理者権限コマンドは以下の形式で構成されます:<br><br>
                <code>ADMIN_EXEC --auth [認証コード] --target [対象] --mode [モード]</code><br><br>
                ※ 脆弱性のあるコマンドはシステムに深刻な被害を与える可能性があります。
            </p>
        </div>

        <div class="input-section">
            <label class="input-label">コマンドを入力してください:</label>
            <div class="input-wrapper">
                <span class="input-prefix">$&gt;</span>
                <input type="text" id="command-input" placeholder="ADMIN_EXEC --auth ... --target ... --mode ..." autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div class="button-section">
            <button class="btn" id="execute-btn">EXECUTE</button>
            <button class="btn btn-cancel" id="cancel-btn">CANCEL</button>
        </div>

        <div class="loading" id="loading">
            <span>処理中</span>
            <span class="loading-dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </div>

        <div id="result-display"></div>
    </div>

    <script src="../js/admin_command.js"></script>
</body>
</html>
