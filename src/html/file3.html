<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不要な写真.jpg</title>
    <link rel="stylesheet" href="../css/style_con.css">
    <link rel="stylesheet" href="../css/file_common.css">
    <link rel="stylesheet" href="../css/file3.css">
    <link rel="stylesheet" href="../css/file3_all.css">
</head>
<body>
    <div class="image-viewer">
        <div class="image-container">
            <div class="placeholder-icon">
                <img src="../pic/家族写真.jpg" width="300" height="200" class="clickable-image" onclick="openModal()" alt="家族写真">
            </div>
        </div>
        <div class="image-info">
            <p><span class="label">ファイル名:</span> 不要な写真.png</p>
            <p><span class="label">サイズ:</span> 1920 x 1080 px</p>
            <p><span class="label">ファイルサイズ:</span> 87 KB</p>
            <p><span class="label">作成日:</span> 2024年6月10日</p>
            <p><span class="label">ステータス:</span> <span style="color: #f48771;">削除予定</span></p>
        </div>
    </div>

    <!-- ノイズオーバーレイ -->
    <div class="noise-overlay" id="noiseOverlay"></div>

    <!-- フルスクリーン画像コンテナ -->
    <div class="fullscreen-container" id="fullscreenContainer">
        <canvas class="fullscreen-canvas" id="fullscreenCanvas"></canvas>
    </div>
    
    <!-- ジャンプスケアオーバーレイ -->
    <div class="jumpscare-overlay" id="jumpscareOverlay">
        <img src="../pic/jumpscare.jpg" class="jumpscare-image" id="jumpscareImage" alt="">
    </div>

    <script>
        let imageLoaded = false;
        let originalImage = new Image();
        originalImage.src = '../pic/家族写真.jpg';
        originalImage.onload = () => { imageLoaded = true; };

        function openModal() {
            const noiseOverlay = document.getElementById('noiseOverlay');
            const body = document.body;
            
            // ホラー風グリッチエフェクトを開始
            noiseOverlay.classList.add('active');
            body.classList.add('glitch-active');
            
            // ノイズ中に画像を処理
            setTimeout(() => {
                drawImageWithBlackEyes();
                body.classList.add('expanded');
            }, 400);
            
            // グリッチエフェクトを終了
            setTimeout(() => {
                noiseOverlay.classList.remove('active');
                body.classList.remove('glitch-active');
            }, 900);
        }

        function drawImageWithBlackEyes() {
            const canvas = document.getElementById('fullscreenCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('fullscreenContainer');
            
            if (!imageLoaded) return;
            
            // キャンバスサイズをウィンドウに合わせる
            const containerWidth = container.clientWidth || window.innerWidth;
            const containerHeight = container.clientHeight || window.innerHeight;
            
            // 画像のアスペクト比を維持しながらフィット
            const imgRatio = originalImage.width / originalImage.height;
            const containerRatio = containerWidth / containerHeight;
            
            let drawWidth, drawHeight, offsetX, offsetY;
            
            if (imgRatio > containerRatio) {
                // 横長の画像 - 幅に合わせる
                drawWidth = containerWidth;
                drawHeight = containerWidth / imgRatio;
                offsetX = 0;
                offsetY = (containerHeight - drawHeight) / 2;
            } else {
                // 縦長の画像 - 高さに合わせる
                drawHeight = containerHeight;
                drawWidth = containerHeight * imgRatio;
                offsetX = (containerWidth - drawWidth) / 2;
                offsetY = 0;
            }
            
            canvas.width = containerWidth;
            canvas.height = containerHeight;
            
            // 背景を黒で塗りつぶし
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, containerWidth, containerHeight);
            
            // 元の画像を描画
            ctx.drawImage(originalImage, offsetX, offsetY, drawWidth, drawHeight);
            
            // スケール係数を計算
            const scaleX = drawWidth / originalImage.width;
            const scaleY = drawHeight / originalImage.height;
            
            // 5人家族の目の位置（元画像サイズ: 275x183 基準）
            const eyePositions = [
                // 人物1（左端）
                { x: 57, y: 100, w: 10, h: 4 },
                // 人物2（左寄り）
                { x: 85, y: 27, w: 9, h: 4 },
                // 人物3（中央）
                { x: 130, y: 40, w: 10, h: 5 },
                // 人物4（右寄り）
                { x: 160, y: 55, w: 9, h: 4 },
                // 人物5（右端）
                { x: 203, y: 40, w: 8, h: 4 },
            ];
            
            // ホラー風の目隠し描画
            eyePositions.forEach(eye => {
                const centerX = offsetX + eye.x * scaleX;
                const centerY = offsetY + eye.y * scaleY;
                const eyeW = eye.w * scaleX * 1.8;
                const eyeH = eye.h * scaleY * 2.5;
                
                ctx.fillStyle = '#000000';
                
                // ぐちゃぐちゃに塗りつぶしたようなストローク
                ctx.strokeStyle = '#000000';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // 乱雑な横線の塗りつぶし（マーカーでぐしゃっと塗った感じ）
                for (let i = 0; i < 15; i++) {
                    ctx.lineWidth = (3 + Math.random() * 8) * scaleX;
                    ctx.beginPath();
                    const yOffset = (Math.random() - 0.5) * eyeH * 1.5;
                    const startX = centerX - eyeW * (0.8 + Math.random() * 0.5);
                    const endX = centerX + eyeW * (0.8 + Math.random() * 0.5);
                    ctx.moveTo(startX, centerY + yOffset);
                    // ガタガタした線
                    const segments = 3 + Math.floor(Math.random() * 4);
                    for (let j = 1; j <= segments; j++) {
                        const segX = startX + (endX - startX) * (j / segments);
                        const segY = centerY + yOffset + (Math.random() - 0.5) * eyeH * 0.5;
                        ctx.lineTo(segX, segY);
                    }
                    ctx.stroke();
                }
                
                // 斜めの乱雑な線
                for (let i = 0; i < 8; i++) {
                    ctx.lineWidth = (2 + Math.random() * 6) * scaleX;
                    ctx.beginPath();
                    const angle = (Math.random() - 0.5) * Math.PI * 0.5;
                    const length = eyeW * (1 + Math.random());
                    const startOffsetX = (Math.random() - 0.5) * eyeW;
                    const startOffsetY = (Math.random() - 0.5) * eyeH;
                    ctx.moveTo(centerX + startOffsetX, centerY + startOffsetY);
                    ctx.lineTo(
                        centerX + startOffsetX + Math.cos(angle) * length,
                        centerY + startOffsetY + Math.sin(angle) * length
                    );
                    ctx.stroke();
                }
                
                // 黒い涙のような垂れ（目から下に流れる）
                const dripCount = 2 + Math.floor(Math.random() * 2);
                for (let i = 0; i < dripCount; i++) {
                    const dripX = centerX + (Math.random() - 0.5) * eyeW;
                    const dripLength = eyeH * (4 + Math.random() * 6);
                    const dripWidth = eyeW * (0.1 + Math.random() * 0.15);
                    
                    // グラデーションで自然な垂れを表現
                    const gradient = ctx.createLinearGradient(dripX, centerY, dripX, centerY + dripLength);
                    gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
                    gradient.addColorStop(0.6, 'rgba(0, 0, 0, 0.7)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(dripX - dripWidth, centerY + eyeH * 0.3);
                    // 不規則なうねり
                    const midY = centerY + dripLength * 0.5;
                    ctx.quadraticCurveTo(
                        dripX - dripWidth * 2 + (Math.random() - 0.5) * dripWidth * 3,
                        midY,
                        dripX,
                        centerY + dripLength
                    );
                    ctx.quadraticCurveTo(
                        dripX + dripWidth * 2 + (Math.random() - 0.5) * dripWidth * 3,
                        midY,
                        dripX + dripWidth,
                        centerY + eyeH * 0.3
                    );
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }

        function closeFullscreen() {
            document.body.classList.remove('expanded');
        }

        // ESCキーでも閉じられるように
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
        
        // ============ 意味深なオブジェクトとジャンプスケア ============
        
        // 意味深なシンボル（目と手のみ）
        
        let creepyObjects = [];
        let handObject = null; // 手は別管理
        let jumpscareTriggered = false;
        
        // 手オブジェクトを配置（閉じるボタン代わり）
        function spawnHandObject() {
            if (handObject) return;
            
            handObject = document.createElement('div');
            handObject.className = 'creepy-object';
            handObject.textContent = '◀';
            handObject.style.opacity = '0.6';
            handObject.style.fontSize = '40px';
            handObject.style.color = '#fff';
            
            // 右下に固定配置
            handObject.style.bottom = '20px';
            handObject.style.right = '20px';
            handObject.style.top = 'auto';
            handObject.style.left = 'auto';
            handObject.style.transform = 'none';
            handObject.title = '戻る';
            
            // クリックで閉じる
            handObject.addEventListener('click', (e) => {
                e.stopPropagation();
                closeFullscreen();
            });
            
            document.body.appendChild(handObject);
        }
        
        // ランダムな位置に意味深オブジェクト（1個だけ）を配置
        function spawnCreepyObjects() {
            // 既存のオブジェクトを削除
            creepyObjects.forEach(obj => obj.remove());
            creepyObjects = [];
            
            const count = 1; // 1個だけ
            
            for (let i = 0; i < count; i++) {
                const obj = document.createElement('div');
                obj.className = 'creepy-object';
                const img = document.createElement('img');
                img.src = '../pic/赤いお手手.png';
                img.alt = '';
                obj.appendChild(img);
                
                // ランダムな位置（画面端に寄りがち）
                const edge = Math.random() < 0.7;
                if (edge) {
                    // 画面端
                    const side = Math.floor(Math.random() * 4);
                    switch(side) {
                        case 0: // 上
                            obj.style.top = (5 + Math.random() * 10) + '%';
                            obj.style.left = (10 + Math.random() * 80) + '%';
                            break;
                        case 1: // 右
                            obj.style.top = (10 + Math.random() * 80) + '%';
                            obj.style.right = (5 + Math.random() * 10) + '%';
                            break;
                        case 2: // 下
                            obj.style.bottom = (5 + Math.random() * 10) + '%';
                            obj.style.left = (10 + Math.random() * 80) + '%';
                            break;
                        case 3: // 左
                            obj.style.top = (10 + Math.random() * 80) + '%';
                            obj.style.left = (5 + Math.random() * 10) + '%';
                            break;
                    }
                } else {
                    // ランダム位置
                    obj.style.top = (15 + Math.random() * 70) + '%';
                    obj.style.left = (15 + Math.random() * 70) + '%';
                }
                
                // ランダムな回転
                obj.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg)`;
                
                // クリックでジャンプスケア
                obj.addEventListener('click', (e) => {
                    e.stopPropagation();
                    triggerJumpscare();
                });
                
                document.body.appendChild(obj);
                creepyObjects.push(obj);
            }
        }
        
        // ジャンプスケア発動（親ウィンドウのdesktop画面全体に表示）
        function triggerJumpscare() {
            if (jumpscareTriggered) return;
            jumpscareTriggered = true;
            
            // 音を鳴らす（オプション - 音声ファイルがあれば）
            // const audio = new Audio('../audio/scream.mp3');
            // audio.play();
            
            // 一度見たフラグを立てる
            hasViewedOnce = true;
            
            // 親ウィンドウを取得
            const targetWindow = window.parent || window;
            const targetDocument = targetWindow.document;
            
            // 親ウィンドウにジャンプスケアオーバーレイを作成（なければ）
            let parentOverlay = targetDocument.getElementById('parentJumpscareOverlay');
            if (!parentOverlay) {
                parentOverlay = targetDocument.createElement('div');
                parentOverlay.id = 'parentJumpscareOverlay';
                
                const img = targetDocument.createElement('img');
                // 親ウィンドウ(index.html)からの相対パス
                img.src = '../pic/jumpscare.jpg';
                img.id = 'parentJumpscareImage';
                
                parentOverlay.appendChild(img);
                targetDocument.body.appendChild(parentOverlay);
                
                // スタイルを追加
                const style = targetDocument.createElement('style');
                style.textContent = `
                    #parentJumpscareOverlay {
                        display: none;
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100vw;
                        height: 100vh;
                        background: #000;
                        z-index: 999999;
                        justify-content: center;
                        align-items: center;
                    }
                    #parentJumpscareOverlay.active {
                        display: flex !important;
                        animation: parentJumpscareFlash 0.5s steps(2) infinite;
                    }
                    #parentJumpscareImage {
                        width: 100vw;
                        height: 100vh;
                        object-fit: cover;
                        filter: contrast(1.2) brightness(1.1);
                    }
                    #parentJumpscareOverlay.active #parentJumpscareImage {
                        animation: parentJumpscareShake 0.1s infinite;
                    }
                    @keyframes parentJumpscareFlash {
                        0%, 100% { background: #000; }
                        50% { background: #1a0000; }
                    }
                    @keyframes parentJumpscareShake {
                        0% { transform: translate(0, 0) scale(1); }
                        25% { transform: translate(-15px, 8px) scale(1.05); }
                        50% { transform: translate(15px, -8px) scale(0.95); }
                        75% { transform: translate(-8px, -15px) scale(1.02); }
                        100% { transform: translate(8px, 15px) scale(0.98); }
                    }
                `;
                targetDocument.head.appendChild(style);
            }
            
            // 表示
            parentOverlay.classList.add('active');
            
            // 画面を激しく揺らす
            document.body.style.animation = 'none';
            document.body.offsetHeight; // リフロー
            document.body.classList.add('glitch-active');
            
            // 1秒後に終了して元に戻す
            setTimeout(() => {
                parentOverlay.classList.remove('active');
                document.body.classList.remove('glitch-active');
                
                // オブジェクトを消す
                creepyObjects.forEach(obj => obj.remove());
                creepyObjects = [];
                
                // 手も消す
                if (handObject) {
                    handObject.remove();
                    handObject = null;
                }
                
                // フルスクリーン表示を閉じて元に戻す
                document.body.classList.remove('expanded');
                
                // フラグをリセット
                jumpscareTriggered = false;
            }, 1000);
        }
        
        // 画像クリック時の処理を変更（2回目以降は即ジャンプスケア）
        let hasViewedOnce = false;
        let isLocked = false; // 開けなくするフラグ
        
        // 親ウィンドウでファイルビューアを閉じる関数
        function closeParentFileViewer() {
            try {
                const targetWindow = window.parent || window;
                const targetDocument = targetWindow.document;
                const container = targetDocument.getElementById('fileViewerContainer3');
                if (container) {
                    container.style.display = 'none';
                    const iframe = container.querySelector('iframe');
                    if (iframe) iframe.src = '';
                }
                
                // 親ウィンドウにフラグを設定（ゴミ箱表示用）
                targetWindow.photoMovedToTrash = true;
                
                // ターミナルのTRASH_FILESにも追加
                const terminalIframe = targetDocument.getElementById('terminal-viewer-iframe');
                if (terminalIframe && terminalIframe.contentWindow) {
                    const terminalWindow = terminalIframe.contentWindow;
                    
                    // puzzleSystemのTRASH_FILESに追加
                    if (terminalWindow.puzzleSystem && terminalWindow.puzzleSystem.TRASH_FILES) {
                        terminalWindow.puzzleSystem.TRASH_FILES['不要な写真.png'] = {
                            displayName: '不要な写真.png',
                            content: [
                                '=== 画像ファイル ===',
                                '',
                                'ファイル名: 不要な写真.png',
                                'サイズ: 87 KB',
                                '作成日: 2009/06/15',
                                '',
                                '[バイナリデータのため表示できません]',
                                '',
                                '※ この写真には何かが写り込んでいた...'
                            ]
                        };
                    }
                    
                    // ファイルシステムからPicturesフォルダを削除し、カレントディレクトリをStudentに戻す
                    if (terminalWindow.vfs && terminalWindow.vfs.fileSystem) {
                        try {
                            const student = terminalWindow.vfs.fileSystem['C:'].children['Users'].children['Student'];
                            if (student && student.children['Pictures']) {
                                // Picturesフォルダを完全に削除
                                delete student.children['Pictures'];
                                console.log('ファイルシステムからPicturesフォルダを削除しました');
                            }
                            
                            // カレントディレクトリをStudentに戻す
                            terminalWindow.vfs.currentPath = ['C:', 'Users', 'Student'];
                            console.log('カレントディレクトリをStudentに戻しました');
                            
                            // ターミナルにエラーメッセージを表示してプロンプトを更新
                            if (terminalWindow.term) {
                                const term = terminalWindow.term;
                                term.write('\r\n');
                                term.write('\r\n\x1b[31m[ERROR]: ファイルシステムエラーが発生しました\x1b[0m\r\n');
                                term.write('\x1b[33m[SYSTEM]: 現在のディレクトリが無効になりました\x1b[0m\r\n');
                                term.write('\x1b[33m[SYSTEM]: C:\\Users\\Student に移動しました\x1b[0m\r\n');
                                term.write('\r\n');
                                // 新しいプロンプトを表示
                                const newPath = terminalWindow.vfs.getPathString();
                                term.write(newPath + '> ');
                                console.log('ターミナルにメッセージを表示しました');
                            } else {
                                console.log('terminalWindow.termが見つかりません');
                            }
                        } catch(e) {
                            console.log('ファイルシステムの操作に失敗:', e);
                        }
                    }
                }
                
            } catch(e) {
                console.log('Could not close parent file viewer:', e);
            }
        }
        
        // フルスクリーン表示時にオブジェクトを配置
        const originalOpenModal = openModal;
        openModal = function() {
            if (isLocked) {
                // ロック後は何も起きない
                return;
            }
            if (hasViewedOnce) {
                // 2回目は即ジャンプスケア、その後ロック＆ファイルビューアを閉じる
                triggerJumpscare();
                // ジャンプスケア終了後にロック＆閉じる
                setTimeout(() => {
                    isLocked = true;
                    closeParentFileViewer();
                }, 1100);
            } else {
                // 初回は通常表示
                originalOpenModal();
                setTimeout(() => {
                    spawnHandObject(); // 手は常に表示
                    spawnCreepyObjects(); // 意味深オブジェクト
                }, 1000);
            }
        };
        
        // フルスクリーン終了時にオブジェクトを削除
        const originalCloseFullscreen = closeFullscreen;
        closeFullscreen = function() {
            originalCloseFullscreen();
            creepyObjects.forEach(obj => obj.remove());
            creepyObjects = [];
            if (handObject) {
                handObject.remove();
                handObject = null;
            }
        };
    </script>
</body>
</html>
