<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不要な写真.jpg</title>
    <link rel="stylesheet" href="../css/style_con.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #111;
            overflow: hidden;
        }
        .image-viewer {
            width: 100%;
            height: 100%;
            padding: 8px;
            padding-top: 20px;
            box-sizing: border-box;
            overflow: auto;
            font-family: 'Segoe UI', 'Yu Gothic', sans-serif;
            color: #fff;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .image-container {
            background-color: #1e1e1e;
            border: 2px dashed #555;
            border-radius: 4px;
            padding: 40px;
            margin-top: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        .placeholder-icon {
            font-size: 60px;
            opacity: 0.6;
        }
        .image-info {
            color: #888;
            font-size: 12px;
            text-align: left;
            background-color: #252526;
            padding: 15px;
            border-radius: 4px;
            width: 80%;
            max-width: 400px;
        }
        .image-info p {
            margin: 5px 0;
        }
        .label {
            color: #569cd6;
        }

        /* カスタムスクロールバー */
        .image-viewer::-webkit-scrollbar {
            width: 10px;
        }
        .image-viewer::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .image-viewer::-webkit-scrollbar-thumb {
            background: rgba(100, 100, 100, 0.6);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .image-viewer::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.8);
        }
        /* Firefox用 */
        .image-viewer {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 100, 100, 0.6) rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="image-viewer">
        <div class="image-container">
            <div class="placeholder-icon">🖼️📷</div>
            <p style="color: #666;">不要な写真.jpg</p>
        </div>
        <div class="image-info">
            <p><span class="label">ファイル名:</span> 不要な写真.jpg</p>
            <p><span class="label">サイズ:</span> 1920 x 1080 px</p>
            <p><span class="label">ファイルサイズ:</span> 2.4 MB</p>
            <p><span class="label">作成日:</span> 2024年6月10日</p>
            <p><span class="label">ステータス:</span> <span style="color: #f48771;">削除予定</span></p>
        </div>
    </div>
</body>
</html>
