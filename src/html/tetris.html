<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テトリス</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        .game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .main-board {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 3px solid #0f3460;
            border-radius: 5px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 150px;
        }

        .info-box {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .info-box h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-box p {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        #nextCanvas {
            background: #0f3460;
        }

        .controls {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
        }

        .controls h3 {
            color: #e94560;
            margin-bottom: 10px;
        }

        .controls p {
            margin: 5px 0;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #e94560;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #fff;
            margin-bottom: 20px;
        }

        .game-over button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .game-over button:hover {
            background: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-board">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>
        <div class="side-panel">
            <div class="info-box">
                <h3>SCORE</h3>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h3>LEVEL</h3>
                <p id="level">1</p>
            </div>
            <div class="info-box">
                <h3>LINES</h3>
                <p id="lines">0</p>
            </div>
            <div class="info-box">
                <h3>NEXT</h3>
                <canvas id="nextCanvas" width="120" height="120"></canvas>
            </div>
            <div class="controls">
                <h3>操作方法</h3>
                <p>← → : 移動</p>
                <p>↑ : 回転</p>
                <p>↓ : 落下加速</p>
                <p>Space : 即落下</p>
                <p>P : 一時停止</p>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>スコア: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">もう一度</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        // テトリミノの形状
        const SHAPES = [
            // I
            [[1, 1, 1, 1]],
            // O
            [[1, 1], [1, 1]],
            // T
            [[0, 1, 0], [1, 1, 1]],
            // S
            [[0, 1, 1], [1, 1, 0]],
            // Z
            [[1, 1, 0], [0, 1, 1]],
            // J
            [[1, 0, 0], [1, 1, 1]],
            // L
            [[0, 0, 1], [1, 1, 1]]
        ];

        // 色
        const COLORS = [
            '#00f5ff', // I - シアン
            '#ffff00', // O - 黄
            '#aa00ff', // T - 紫
            '#00ff00', // S - 緑
            '#ff0000', // Z - 赤
            '#0000ff', // J - 青
            '#ff8800'  // L - オレンジ
        ];

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;

        // ボードを初期化
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = 0;
                }
            }
        }

        // ピースを作成
        function createPiece() {
            const index = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[index],
                color: COLORS[index],
                x: Math.floor(COLS / 2) - Math.floor(SHAPES[index][0].length / 2),
                y: 0
            };
        }

        // ピースを描画
        function drawPiece(piece, context, offsetX = 0, offsetY = 0) {
            context.fillStyle = piece.color;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const x = (piece.x + c + offsetX) * BLOCK_SIZE;
                        const y = (piece.y + r + offsetY) * BLOCK_SIZE;
                        context.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        
                        // ハイライト
                        context.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        context.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, 5);
                        context.fillStyle = piece.color;
                    }
                }
            }
        }

        // ボードを描画
        function drawBoard() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // グリッド線
            ctx.strokeStyle = '#1a1a3e';
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(canvas.width, r * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }

            // 固定されたブロック
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, 5);
                    }
                }
            }
        }

        // NEXTピースを描画
        function drawNextPiece() {
            nextCtx.fillStyle = '#0f3460';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const offsetX = (4 - nextPiece.shape[0].length) / 2;
                const offsetY = (4 - nextPiece.shape.length) / 2;
                
                nextCtx.fillStyle = nextPiece.color;
                for (let r = 0; r < nextPiece.shape.length; r++) {
                    for (let c = 0; c < nextPiece.shape[r].length; c++) {
                        if (nextPiece.shape[r][c]) {
                            const x = (c + offsetX) * BLOCK_SIZE;
                            const y = (r + offsetY) * BLOCK_SIZE;
                            nextCtx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        }
                    }
                }
            }
        }

        // 衝突判定
        function collision(piece, offsetX = 0, offsetY = 0) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const newX = piece.x + c + offsetX;
                        const newY = piece.y + r + offsetY;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ピースを固定
        function lockPiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        if (currentPiece.y + r < 0) {
                            gameOver();
                            return;
                        }
                        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
            clearLines();
            currentPiece = nextPiece;
            nextPiece = createPiece();
            drawNextPiece();

            if (collision(currentPiece)) {
                gameOver();
            }
        }

        // ライン消去
        function clearLines() {
            let linesCleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                let full = true;
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c]) {
                        full = false;
                        break;
                    }
                }
                if (full) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(0));
                    linesCleared++;
                    r++;
                }
            }

            if (linesCleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                lines += linesCleared;
                level = Math.floor(lines / 10) + 1;
                updateUI();
            }
        }

        // ピースを回転
        function rotatePiece() {
            const rotated = [];
            for (let c = 0; c < currentPiece.shape[0].length; c++) {
                rotated[c] = [];
                for (let r = currentPiece.shape.length - 1; r >= 0; r--) {
                    rotated[c].push(currentPiece.shape[r][c]);
                }
            }
            
            const oldShape = currentPiece.shape;
            currentPiece.shape = rotated;
            
            if (collision(currentPiece)) {
                currentPiece.shape = oldShape;
            }
        }

        // ピースを移動
        function movePiece(dir) {
            if (!collision(currentPiece, dir, 0)) {
                currentPiece.x += dir;
            }
        }

        // ピースを落下
        function dropPiece() {
            if (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                lockPiece();
            }
        }

        // 即落下
        function hardDrop() {
            while (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            lockPiece();
            updateUI();
        }

        // UI更新
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        // ゲームオーバー
        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // ゲーム再開
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            isGameOver = false;
            score = 0;
            lines = 0;
            level = 1;
            updateUI();
            initBoard();
            currentPiece = createPiece();
            nextPiece = createPiece();
            drawNextPiece();
            startGame();
        }

        // ゲーム開始
        function startGame() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                if (!isPaused && !isGameOver) {
                    dropPiece();
                    draw();
                }
            }, Math.max(100, 1000 - (level - 1) * 100));
        }

        // 描画
        function draw() {
            drawBoard();
            if (currentPiece) {
                drawPiece(currentPiece, ctx);
            }
        }

        // キー入力
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            switch (e.key) {
                case 'ArrowLeft':
                    movePiece(-1);
                    break;
                case 'ArrowRight':
                    movePiece(1);
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case 'ArrowDown':
                    dropPiece();
                    score += 1;
                    updateUI();
                    break;
                case ' ':
                    hardDrop();
                    break;
                case 'p':
                case 'P':
                    isPaused = !isPaused;
                    break;
            }
            draw();
        });

        // 初期化
        initBoard();
        currentPiece = createPiece();
        nextPiece = createPiece();
        drawNextPiece();
        draw();
        startGame();
    </script>
</body>
</html>
