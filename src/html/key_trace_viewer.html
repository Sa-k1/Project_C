<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Key Trace Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a1a0a 0%, #152d15 100%);
      color: #00ff00;
      min-height: 100vh;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }
    .container {
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00ff00;
      border-radius: 10px;
      padding: 24px;
      max-width: 900px;
      width: 98vw;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    }
    .header-bar {
      background: #00ff00;
      color: #000;
      padding: 10px;
      margin: -30px -30px 20px -30px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 1.2em;
    }
    .content-box {
      background: #111;
      border: 1px solid #333;
      padding: 20px;
      margin: 15px 0;
      text-align: center;
    }
    .section-title {
      color: #00ff00;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      background: #002200;
      border-left: 3px solid #00ff00;
      border-radius: 5px;
      text-align: left;
    }
    .status-label {
      color: #00ff00;
      font-weight: bold;
    }
    .status-value {
      color: #88ff88;
    }
    .hint {
      color: #88ff88;
      font-style: italic;
      margin-top: 15px;
      padding: 10px;
      border-left: 3px solid #00ff00;
      background: rgba(0, 255, 0, 0.1);
    }
    .popup-img {
      margin: 16px auto 16px auto;
      display: block;
      max-width: 100%;
      max-height: 80vh;
      border: 2px solid #00ff00;
      box-shadow: 0 0 20px #000;
      background: #222;
    }
  </style>
</head>
<body>
  <!-- デバッグ用表示は不要なので削除 -->
  <div class="container">
    <div class="header-bar">キーログ画像ビューア</div>
    <div class="content-box">
      <div class="section-title">=== キートレース画像 ===</div>
            <img src="../pic/key_trace.png" alt="key trace" class="popup-img">
    </div>
    <div class="status">
      <span class="status-label">ステータス: </span>
      <span class="status-value">表示中 ✓</span>
    </div>
  </div>
</body>
</html>
