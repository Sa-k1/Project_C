<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>親ウィンドウですわ</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      overflow: hidden;
    }

    .mini-window {
      position: absolute;
      width: 200px;
      height: 150px;
      background: white;
      border: 2px solid #555;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      cursor: move;
      top: 50px;
      left: 50px;
    }
  </style>
</head>
<body>
  <div class="mini-window" id="miniWindow">
    <p style="margin: 10px;">子ウィンドウ風ですわ！</p>
  </div>

  <script>
    const mini = document.getElementById('miniWindow');
    let offsetX, offsetY, isDragging = false;

    mini.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.offsetX;
      offsetY = e.offsetY;
    });

    document.addEventListener('mouseup', () => isDragging = false);

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      mini.style.left = `${e.pageX - offsetX}px`;
      mini.style.top = `${e.pageY - offsetY}px`;
    });
  </script>
</body>
</html>
